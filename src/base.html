<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>CHOUF</title>
<style>
:root{--nuit:#111214;--nuit2:#1c1d20;--nuit3:#2c2e33;--sodium:#e8b64c;--mer:#2d7fd6;--ciel:#8fc6ff;--craie:#f2ede3;--gris:#9aa3b8;--rouge:#e5484d;--vert:#3fb27f;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--nuit);color:var(--craie);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.entete{position:sticky;top:0;z-index:5;background:var(--nuit);box-shadow:0 6px 10px var(--nuit);padding:10px 14px 8px}
.entete .l1{display:flex;justify-content:space-between;align-items:baseline}.entete .l1 span{color:var(--gris);font-size:13px}
.entete .l2{display:flex;gap:12px;margin-top:4px;font-size:14px}.res small{color:var(--gris);font-size:11px}
.res.e{color:var(--sodium)}.res.s{color:var(--ciel)}.res.a{margin-left:auto}
.corps{padding:0 14px 150px}
.onglets{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--nuit2);border-top:1px solid var(--nuit3);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.onglets button{flex:1;padding:13px 0;font-size:13px;color:var(--gris)}.onglets button.on{color:var(--sodium);font-weight:600}
.h{font-size:22px;margin:10px 0 6px}.h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);margin:20px 0 8px}
.petit{font-size:13px;color:var(--gris);margin:4px 0}
.btn{display:block;width:100%;padding:14px;border-radius:var(--r);background:var(--sodium);color:#1a1205;font-weight:700;margin:10px 0;text-align:center}
.btn.sec{background:var(--nuit3);color:var(--craie);font-weight:500}.btn.opt{background:var(--nuit3);color:var(--craie);text-align:left;font-weight:500}
.jauge{height:6px;background:var(--nuit3);border-radius:3px;overflow:hidden;margin:4px 0}.jauge i{display:block;height:100%;background:var(--sodium)}
.jauge.police i{background:var(--mer)}.jauge.tension i{background:var(--rouge)}.jauge.humeur i,.jauge.conf i,.jauge.confiance i{background:var(--vert)}.jauge.comp i{background:var(--ciel)}
.indic{margin:10px 0}.indic .ligne{display:flex;justify-content:space-between;font-size:14px}
.ligne-action{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--nuit2);border-radius:var(--r);padding:12px 14px;margin:8px 0}
.ligne-action small{display:block;color:var(--gris);font-size:12px}.ligne-action em{font-style:normal;color:var(--sodium);white-space:nowrap}.ligne-action.off{opacity:.45}
.clore{margin-top:22px}
.banniere{width:calc(100% + 28px);margin:0 -14px;height:150px;object-fit:cover;display:block}
.ph{background:linear-gradient(135deg,#34373c,#141517 60%,#3a2c18)}.ph-medaillon{background:radial-gradient(circle at 50% 40%,#45484e,#1c1d20);border:2px solid #5a5e66}
.ph-scene{background:linear-gradient(160deg,#3a3d42,#141517 70%,#4a3414)}
.plan{width:100%;display:block;border-radius:var(--r)}.plan .mer{fill:#0f2a4d}.plan .terre{fill:#1a2138}
.plan .zone{stroke:#0b1020;stroke-width:2;fill:#232c4a;cursor:pointer}.plan .zone.c1,.plan .zone.c2{fill:#2f3c66}.plan .zone.c3,.plan .zone.c4{fill:#5b4a2e}
.plan .zone.chez{fill:#8a5a22}.plan .zone.ici{stroke:var(--sodium);stroke-width:3}
.plan .lbl{fill:var(--craie);font-size:9.5px;text-anchor:middle;pointer-events:none;font-weight:600}.plan .mer-lbl{fill:#5f86b8;font-style:italic;text-anchor:start}
.legende .pt{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle}.pt.c3{background:#8a5a22}.pt.c1{background:#2f3c66}.pt.c0{background:#232c4a}
.retour{color:var(--sodium);padding:8px 0;font-size:15px}
.pnj{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--nuit2);border-radius:var(--r);padding:10px 12px;margin:6px 0}
.pnj span{flex:1}.pnj small{display:block;color:var(--gris);font-size:12px}
.med{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}.med.grand{width:96px;height:96px;margin:6px auto;display:block}
.fiche{text-align:center}.fiche p{text-align:left}.mem{padding-left:18px}
.journal{list-style:none;padding:0}.journal li{padding:8px 0;border-bottom:1px solid var(--nuit3);font-size:14px}.journal small{color:var(--gris)}.journal em{color:var(--gris)}
.journal .choix{color:var(--craie)}.journal .chiffre{color:var(--gris);font-size:13px}.journal .chapitre{color:var(--sodium)}
.voile{position:fixed;inset:0;background:rgba(5,8,18,.78);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--nuit2);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:10px 0 6px}.scene{width:100%;height:170px;border-radius:12px;object-fit:cover;display:block}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--craie);color:var(--nuit);padding:10px 16px;border-radius:12px;max-width:92%;z-index:20;font-size:14px}
.accueil{padding:40px 20px}.titre{font-size:56px;letter-spacing:.2em;margin:30px 0 0;color:var(--sodium)}.sous{color:var(--gris);margin-top:0}
.avert{font-size:13px;color:var(--gris);border-left:3px solid var(--sodium);padding-left:10px}
.champ{display:block;margin:18px 0 0;font-size:13px;color:var(--gris)}.champ input{display:block;width:100%;margin-top:6px;padding:13px;border-radius:12px;border:1px solid var(--nuit3);background:var(--nuit2);color:var(--craie);font:inherit}
.carte-bloc{background:var(--nuit2);border-radius:var(--r);padding:14px;margin:18px 0}
.vue-ville{position:relative;margin:0 -14px;height:calc(100vh - 210px);min-height:420px;overflow:hidden;background:#0d151b}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud-haut{position:absolute;top:8px;left:10px;right:10px;background:rgba(17,18,20,.82);border:1px solid #3a3d42;border-radius:12px;padding:8px 10px;pointer-events:none}
.hud-titre{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sodium);font-weight:700}
.parts{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 5px;background:#2c2e33}.parts i{display:block;height:100%}
.hud-leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:#c9cbd0}.hud-leg b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.hud-zoom{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.hud-zoom button{width:38px;height:38px;border-radius:50%;background:rgba(17,18,20,.85);border:2px solid #5a5e66;font-size:20px;font-weight:700}
.hud-bas{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(17,18,20,.92);border:1px solid #3a3d42;border-top:3px solid var(--sodium);border-radius:12px;padding:10px 12px}
.hud-bas.petit-hb{border-top-width:1px;font-size:12px;color:var(--gris);text-align:center;padding:8px}
.hb-l1{display:flex;justify-content:space-between;align-items:baseline}.hb-l1 b{font-size:17px;color:var(--sodium)}.hb-l1 span{font-size:12px;color:var(--gris)}
.hb-ctrl{font-size:13px;margin:4px 0}.hb-ctrl b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.hb-stats{display:flex;gap:14px;font-size:12px;color:var(--gris)}.hb-stats b{color:var(--craie)}
.hb-txt{font-size:13px;margin:6px 0 4px;color:#d7d8db}.hb-btns{display:flex;gap:8px}.hb-btns .btn{margin:6px 0 0;padding:10px}
.ico{width:20px;height:20px;vertical-align:-5px}
.hero{display:block;width:calc(100% + 40px);margin:-40px -20px 0;height:220px;object-fit:cover;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.duo{display:flex;gap:10px;justify-content:center}.duo .med.grand{width:110px;height:110px;margin:0}
.banniere{filter:saturate(.9)}
.bandeau{position:sticky;top:0;z-index:5;background:var(--nuit);padding:6px 8px 6px;box-shadow:0 4px 8px var(--nuit)}
.cyc{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 4px}.cyc span{color:var(--gris);font-size:12px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.chip{display:flex;gap:5px;align-items:center;background:var(--nuit2);border:1px solid var(--nuit3);border-radius:10px;padding:4px 6px;text-align:left;min-width:0}
.chip .ico{width:22px;height:22px;flex:none}.chip span{min-width:0;display:block;line-height:1.15}.chip small{display:block;font-size:10px;color:var(--gris)}
.chip b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.chip em{font-style:normal;font-size:10px}.chip em.up{color:#6ccf4f}.chip em.dn{color:#e5484d}
.chip.al{border-color:#e5484d;background:#2a1517}
.corps.carte{padding:0}.corps{padding-bottom:140px}
.vue-ville{height:calc(100vh - 230px);min-height:380px;margin:0}
.pied{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:6;background:var(--nuit2);border-top:1px solid var(--nuit3)}
.pied .valider{margin:6px 8px;width:calc(100% - 16px);padding:12px;letter-spacing:.04em;text-transform:uppercase}
.pied .onglets{position:static;transform:none;border:0}.pied .onglets button{padding:9px 0 calc(9px + env(safe-area-inset-bottom));font-size:12px}
.hud-bas{bottom:8px}.fiche-q{padding-top:0;overflow:hidden}.fq-ban{display:block;width:calc(100% + 24px);margin:0 -12px 6px;height:64px;object-fit:cover;opacity:.85}
.barre-ctl{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#3a3d42;margin:4px 0}.barre-ctl i{display:block;height:100%}.barre-ctl i.moi{background:#6ccf4f}
.ligne-action.spe{border:1px solid var(--sodium)}
.op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--nuit2);border-radius:var(--r);padding:10px 12px;margin:6px 0}
.op>span{flex:1;min-width:0}.op small{display:block;color:var(--gris);font-size:12px}.med.lettre{display:flex;align-items:center;justify-content:center;border:3px solid;font-weight:800;font-size:18px;background:#1b1c1f}
.jauge.fat i{background:#e5484d}.pt{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:0}
.carte-bloc .ligne{display:flex;justify-content:space-between;align-items:center;gap:8px}.carte-bloc .ligne b{flex:1}
.grille{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;margin:8px 0}.grille small{display:block;font-size:11px;color:var(--gris)}.grille b{font-size:14px}
.faction{border-left:4px solid}.faction.morte{opacity:.45}.faction .med{width:40px;height:40px}
.ok{color:#6ccf4f;font-style:normal}.ligne-chiffre{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--nuit3);font-size:14px}
.ligne-chiffre b.neg{color:#e5484d}.ligne-chiffre.tot{font-weight:700;border-bottom:0}.alertes{padding-left:18px;color:#f0b4b4;font-size:14px}
.rapport{list-style:none;padding:0;margin:8px 0;font-size:14px}.rapport li{padding:5px 0;border-bottom:1px solid var(--nuit3)}
.rapport .attaque,.rapport .perte,.rapport .perteop,.rapport .rupture,.rapport .operation{color:#f0a0a0}.rapport .gain,.rapport .capacite,.rapport .recrue{color:#9fe08a}
.note{font-size:28px;color:var(--sodium);margin:0 0 14px}.h small{font-size:14px;color:var(--gris)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*__DATA__*/

if (!window.__NOBOOT__) boot();

</body>
</html>
