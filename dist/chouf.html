<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--nuit);color:var(--craie);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.entete{position:sticky;top:0;z-index:5;background:var(--nuit);box-shadow:0 6px 10px var(--nuit);padding:10px 14px 8px}
.entete .l1{display:flex;justify-content:space-between;align-items:baseline}.entete .l1 span{color:var(--gris);font-size:13px}
.entete .l2{display:flex;gap:12px;margin-top:4px;font-size:14px}.res small{color:var(--gris);font-size:11px}
.res.e{color:var(--sodium)}.res.s{color:var(--ciel)}.res.a{margin-left:auto}
.corps{padding:0 14px 150px}
.onglets{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--nuit2);border-top:1px solid var(--nuit3);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.onglets button{flex:1;padding:13px 0;font-size:13px;color:var(--gris)}.onglets button.on{color:var(--sodium);font-weight:600}
.h{font-size:22px;margin:10px 0 6px}.h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);margin:20px 0 8px}
.petit{font-size:13px;color:var(--gris);margin:4px 0}
.btn{display:block;width:100%;padding:14px;border-radius:var(--r);background:var(--sodium);color:#1a1205;font-weight:700;margin:10px 0;text-align:center}
.btn.sec{background:var(--nuit3);color:var(--craie);font-weight:500}.btn.opt{background:var(--nuit3);color:var(--craie);text-align:left;font-weight:500}
.jauge{height:6px;background:var(--nuit3);border-radius:3px;overflow:hidden;margin:4px 0}.jauge i{display:block;height:100%;background:var(--sodium)}

#plan{width:100%;height:100%;display:block;touch-action:none;cursor:grab}

.hb-txt{font-size:13px;margin:6px 0 4px;color:#d7d8db}.hb-btns{display:flex;gap:8px}.hb-btns .btn{margin:6px 0 0;padding:10px}

/* CHOUF — 00-core : état G, hasard reproductible, horloges, sauvegarde, journal.
   Aucune valeur d'équilibrage ici : tout vient de DATA (data/*.json injecté par build.py). */

var D = window.DATA;            // données du jeu
var B = D.equilibrage;           // raccourci équilibrage
var G = null;                    // état de partie
var SAVE_KEY = "chouf_v1";

/** Horloge réelle injectable (le simulateur la remplace). */
var CLOCK = { now: function () { return Date.now(); } };

/** Index des listes de données par id. */
var IDX = {};
["zones", "personnages", "equipes", "roles", "competences", "evenements", "missions"].forEach(function (k) {
  IDX[k] = {};
  D[k].liste.forEach(function (x) { IDX[k][x.id] = x; });
});
IDX.chapitres = {};
D.calendrier.chapitres.forEach(function (c, i) { c.i = i; IDX.chapitres[c.id] = c; });
IDX.familles = {};
(D.personnages.familles || []).forEach(function (f) { IDX.familles[f.id] = f; });

/** Hasard reproductible (mulberry32), l'état tient dans G.seed. */
function rnd() {
  var t = (G.seed = (G.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rint(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/** Date de campagne → nombre de semaines depuis l'an 0 (comparaisons faciles). */
function wk(c) { return c.annee * 52 + (c.semaine - 1); }
function wkToCal(n) { return { annee: Math.floor(n / 52), semaine: (n % 52) + 1 }; }
function nowWk() { return wk(G.cal); }

/** Âge du protagoniste à la semaine courante. */
function age() {
  var n = G.protagoniste.naissance;
  return Math.floor((nowWk() - wk(n)) / 52);
}
function estMineur() { return age() < D.equilibrage.evenements.mineur_age; }

/** Nom affiché d'un personnage : surnom si l'usage du quartier, sinon prénom. */
function pnjNom(id) {
  var p = IDX.personnages[id];
  if (!p) return id;
  var pr = p.prenom === "{famille}" ? famillePrenom(id) : p.prenom;
  return p.surnom || pr;
}
function pnjNomComplet(id) {
  var p = IDX.personnages[id];
  if (!p) return id;
  var pr = p.prenom === "{famille}" ? famillePrenom(id) : p.prenom;
  var nom = p.nom || (p.groupe === "famille" && p.prenom === "{famille}" ? IDX.familles[G.famille].nom : "");
  var s = pr + (nom ? " " + nom : "");
  return p.surnom ? s + " « " + p.surnom + " »" : s;
}
function famillePrenom(id) {
  var f = IDX.familles[G.famille];
  return f && f[id] ? f[id].prenom : id;
}
function pnjAge(id) {
  var p = IDX.personnages[id];
  var a = p.age_2021 != null ? p.age_2021 : (IDX.familles[G.famille][id] || {}).age_2021;
  return a == null ? null : a + (G.cal.annee - 2021);
}

/** Journal : chaque changement significatif garde sa cause (règle UX du GDD V7 §6). */
function log(texte, type, cause) {
  G.journal.unshift({ a: G.cal.annee, s: G.cal.semaine, t: texte, type: type || "info", cause: cause || null });
  if (G.journal.length > 300) G.journal.length = 300;
}

/** Nouvelle partie. prenom : choisi par le joueur. seed : facultatif (tests). */
function newGame(prenom, seed) {
  var T = B.temps, P = B.protagoniste;
  G = { v: 1, seed: (seed == null ? (CLOCK.now() & 0x7fffffff) : seed) | 0 };
  var departs = D.zones.liste.filter(function (z) { return z.depart; });
  var zo = pick(departs).id;
  G.famille = pick(D.personnages.familles).id;
  G.cal = { annee: T.semaine_depart.annee, semaine: T.semaine_depart.semaine };
  G.chapitre = D.calendrier.chapitres[0].id;
  G.temps = { energie: T.energie_depart, sangfroid: T.sangfroid_max, maj: CLOCK.now() };
  G.protagoniste = {
    prenom: (prenom || "Toi").trim().slice(0, 18) || "Toi",
    naissance: { annee: P.naissance_annee, semaine: rint(P.naissance_semaines[0], P.naissance_semaines[1]) },
    zone_origine: zo,
    competences: JSON.parse(JSON.stringify(P.competences_depart)),
    etat: JSON.parse(JSON.stringify(P.etat_depart)),
    scolarite: { statut: "lycee", assiduite: 70 },
    positionnement: { respect: 5, influence: 0, crainte: 0 },
    responsabilites: [], engagements: []
  };
  G.argent = { propre: rint(P.argent_propre_depart[0], P.argent_propre_depart[1]), sale: 0, dettes: [] };
  G.relations = {};
  B.relations.connus_depart.forEach(function (id) { connaitre(id, true); });
  G.zones = {};
  var vois = B.zones.voisines[zo] || [];
  D.zones.liste.forEach(function (z) {
    G.zones[z.id] = {
      connu: z.id === zo ? B.zones.connu_depart_zone_origine : vois.indexOf(z.id) >= 0 ? B.zones.connu_depart_voisines : B.zones.connu_depart_autres,
      influence: 0, tension: z.tension, police: z.police, humeur: z.humeur, plans: 0, coffre: 0, controle: z.controle
    };
  });
  G.zone = zo;                                   // zone affichée / où l'on agit
  G.organisation = { existe: false, nom: null, stabilite: 50, confiance_interne: 50, resilience: 40, ancrage: 50, membres: [], facades: [], reseaux: [] };
  G.police = { pression_ville: 30, enquete: 0, operation: null };
  G.rivaux = {};
  D.equipes.liste.forEach(function (e) { G.rivaux[e.id] = { force: e.force, relation: "neutre" }; });
  G.progression = { drapeaux: [], irreversibles: [], options: [], signaux: {} };
  G.evenements = { faits: {}, programmes: [], vus: {} };
  G.maitrise = {};                               // missions : nombre de fois réussies
  G.semaine_actions = 0;
  G.journal = []; G.messages = []; G.file = []; G.carte = null;
  G.absence = null;
  D.equilibrage.evenements.prologue.forEach(function (p) { programmer(p.id, p.dans, {}); });
  log("Rentrée " + G.cal.annee + ". Tu as " + age() + " ans. Tu habites " + IDX.zones[zo].nom + ".", "chapitre");
  declencherCalendrier();
  return G;
}

/** Rend un personnage connu (crée sa relation à partir des valeurs de départ). */
function connaitre(id, silencieux) {
  if (G.relations[id] || !IDX.personnages[id]) return;
  var r = IDX.personnages[id].relation_depart;
  G.relations[id] = { confiance: r.confiance, proximite: r.proximite, tension: r.tension, memoire: [], etat: "present", contact: nowWkSafe() };
  if (!silencieux) log("Tu connais maintenant " + pnjNomComplet(id) + ".", "rencontre");
}
function nowWkSafe() { return G && G.cal ? nowWk() : 0; }

function programmer(id, dans, ctx) {
  G.evenements.programmes.push({ id: id, a: nowWk() + dans, ctx: ctx || {} });
}

/* ---------- Sauvegarde (même principe que KICK : un seul objet JSON) ---------- */
var STORE = {
  get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { window.localStorage.removeItem(k); } catch (e) {} }
};
function save() { if (G) STORE.set(SAVE_KEY, JSON.stringify(G)); }
function hasSave() { return !!STORE.get(SAVE_KEY); }
function loadSave() {
  var s = STORE.get(SAVE_KEY);
  if (!s) return false;
  try { G = JSON.parse(s); } catch (e) { return false; }
  return migrate();
}
/** Migrations de sauvegarde par numéro de version. */
function migrate() {
  if (!G || G.v !== 1) return false;
  return true;
}
function eraseSave() { STORE.del(SAVE_KEY); G = null; }

/* ---- 10-regles.js ---- */
/* CHOUF — 10-regles : interpréteur des conditions et des effets écrits dans data/*.json.
   Grammaire (design/02-modele-donnees.md §12) :
   conditions : fait:ID · competence:ID>=N · relation:ID.champ>=N / !=valeur · zone:champ>=N ·
                police:enquete>=N · positionnement:x>=N · engagement_rompu:ID · a|b (ou)
   effets     : relation:ID.champ±N · competence:ID±N · scolarite.assiduite±N · etat:champ±N ·
                temps:energie±N · argent:propre±N · zone:champ±N · police:enquete±N ·
                positionnement:x±N · engagement:PNJ:ID:SEMAINES */

/** Remplace {pnj}, {mere}, {pnj.prenom}… dans un texte ou une règle. */
function fill(s, ctx) {
  if (!s) return s;
  return String(s).replace(/\{pnj\}/g, (ctx && ctx.pnj) || "pnj");
}
/** Texte affichable : {pnj} → nom du personnage. */
function fillTexte(s, ctx) {
  return String(s || "").replace(/\{(\w+)(?:\.(\w+))?\}/g, function (m, a) {
    if (a === "joueur") return G.protagoniste.prenom;
    var id = a === "pnj" ? (ctx && ctx.pnj) : a;
    return IDX.personnages[id] ? pnjNom(id) : m;
  });
}

/** Lit une valeur de l'état à partir d'une référence de règle. */
function lire(ref) {
  var m;
  if ((m = /^relation:(\w+)\.(\w+)$/.exec(ref))) { var r = G.relations[m[1]]; return r ? r[m[2]] : undefined; }
  if ((m = /^competence:(\w+)$/.exec(ref))) return G.protagoniste.competences[m[1]];
  if ((m = /^zone:(\w+)$/.exec(ref))) return G.zones[G.zone][m[1]];
  if (ref === "police:enquete") return G.police.enquete;
  if ((m = /^positionnement:(\w+)$/.exec(ref))) return G.protagoniste.positionnement[m[1]];
  if ((m = /^etat:(\w+)$/.exec(ref))) return G.protagoniste.etat[m[1]];
  if (ref === "scolarite.assiduite") return G.protagoniste.scolarite.assiduite;
  if ((m = /^membre:(\w+)\.(\w+)$/.exec(ref))) {
    var mb = G.organisation.membres.filter(function (x) { return x.role === m[1] && x.statut === "actif"; })[0];
    return mb ? mb[m[2]] : undefined;
  }
  return undefined;
}

/** Évalue une condition (chaîne). */
function cond(c, ctx) {
  if (!c) return true;
  c = fill(c, ctx);
  if (c.indexOf("|") >= 0) return c.split("|").some(function (x) { return cond(x, ctx); });
  var m;
  if ((m = /^fait:(\w+)$/.exec(c))) return !!G.evenements.faits[m[1]];
  if ((m = /^engagement_rompu:(\w+)$/.exec(c))) {
    return G.protagoniste.engagements.some(function (e) { return e.envers === m[1] && e.tenu === false; });
  }
  if ((m = /^(.+?)(>=|<=|!=|=|>|<)(.+)$/.exec(c))) {
    var v = lire(m[1]), w = isNaN(+m[3]) ? m[3] : +m[3];
    if (v === undefined) return m[2] === "!=";
    switch (m[2]) {
      case ">=": return v >= w; case "<=": return v <= w; case ">": return v > w; case "<": return v < w;
      case "=": return v == w; case "!=": return v != w;
    }
  }
  return false;
}
function conds(list, ctx) { return (list || []).every(function (c) { return cond(c, ctx); }); }

/** Applique un changement borné et écrit la cause dans le journal si elle est donnée. */
function change(ref, delta, cause) {
  var m, o, k, lo = 0, hi = 100;
  if ((m = /^relation:(\w+)\.(\w+)$/.exec(ref))) { connaitre(m[1]); o = G.relations[m[1]]; k = m[2]; o.contact = nowWk(); }
  else if ((m = /^competence:(\w+)$/.exec(ref))) { o = G.protagoniste.competences; k = m[1]; delta = gainCompetence(o[k], delta); }
  else if ((m = /^zone:(\w+)$/.exec(ref))) { o = G.zones[G.zone]; k = m[1]; }
  else if (ref === "police:enquete") { o = G.police; k = "enquete"; }
  else if ((m = /^positionnement:(\w+)$/.exec(ref))) { o = G.protagoniste.positionnement; k = m[1]; }
  else if ((m = /^etat:(\w+)$/.exec(ref))) { o = G.protagoniste.etat; k = m[1]; }
  else if (ref === "scolarite.assiduite") { o = G.protagoniste.scolarite; k = "assiduite"; }
  else if ((m = /^temps:(\w+)$/.exec(ref))) { o = G.temps; k = m[1]; hi = B.temps[k + "_max"] || 999; }
  else if ((m = /^argent:(\w+)$/.exec(ref))) { o = G.argent; k = m[1]; hi = 1e12; lo = -1e12; }
  else return 0;
  var avant = o[k] || 0;
  o[k] = clamp(Math.round((avant + delta) * 10) / 10, lo, hi);
  var d = o[k] - avant;
  if (cause && d && Math.abs(d) >= 3) log(libelle(ref) + " " + (d > 0 ? "+" : "") + Math.round(d), "chiffre", cause);
  return d;
}
/** Rendement décroissant des compétences au palier 4 (GDD V7 §12 C, option 3). */
function gainCompetence(v, delta) {
  if (delta <= 0) return delta;
  delta = Math.min(delta, B.competences.gain_max_par_evenement);
  return v >= B.competences.seuils[3] ? delta * B.competences.rendement_palier4 : delta;
}
function libelle(ref) {
  var m;
  if ((m = /^relation:(\w+)\.(\w+)$/.exec(ref))) return m[2].charAt(0).toUpperCase() + m[2].slice(1) + " de " + pnjNom(m[1]);
  if ((m = /^competence:(\w+)$/.exec(ref))) return IDX.competences[m[1]].nom;
  if ((m = /^zone:(\w+)$/.exec(ref))) return m[1].charAt(0).toUpperCase() + m[1].slice(1) + " du quartier";
  if (ref === "police:enquete") return "Attention de la police";
  if ((m = /^\w+:(\w+)$/.exec(ref))) return m[1].charAt(0).toUpperCase() + m[1].slice(1);
  return ref;
}

/** Applique un effet (chaîne). cause : texte court pour le journal. */
function effet(e, ctx, cause) {
  e = fill(e, ctx);
  var m;
  if ((m = /^engagement:(\w+):(\w+):(\d+)$/.exec(e))) {
    G.protagoniste.engagements.push({ id: m[2], envers: m[1], echeance: nowWk() + +m[3], tenu: null });
    log("Tu as promis quelque chose à " + pnjNom(m[1]) + ".", "engagement");
    return;
  }
  if ((m = /^(.+?)([+-]\d+(?:\.\d+)?)$/.exec(e))) change(m[1], +m[2], cause);
}

/** Mémoire : "pnj:drapeau" ou "*:drapeau" (fait de campagne). */
function memoriser(s, ctx) {
  if (!s) return;
  s = fill(s, ctx);
  var p = s.split(":");
  if (p[0] === "*") { if (G.progression.drapeaux.indexOf(p[1]) < 0) G.progression.drapeaux.push(p[1]); return; }
  connaitre(p[0]);
  var r = G.relations[p[0]];
  if (r && r.memoire.indexOf(p[1]) < 0) r.memoire.push(p[1]);
}

/** Palier (1..4) d'une compétence. */
function palier(v) {
  var s = B.competences.seuils, p = 1;
  for (var i = 1; i < s.length; i++) if (v >= s[i]) p = i + 1;
  return p;
}

/* ---- 20-temps.js ---- */
/* CHOUF — 20-temps : énergie et sang-froid en temps réel (rythme « mélange »).
   La semaine de campagne n'avance que quand le joueur la clôture (30-semaine.js). */

/** Recharge l'énergie et le sang-froid selon le temps réel écoulé depuis G.temps.maj.
    Retourne le résumé « Pendant ton absence » si l'absence est assez longue. */
function syncTemps() {
  var T = B.temps, t = G.temps, now = CLOCK.now();
  var dt = Math.max(0, now - t.maj);
  var resume = null;
  if (dt >= T.absence_resume_min * 60000) resume = { minutes: Math.round(dt / 60000), energie: t.energie, sangfroid: t.sangfroid };
  var e = T.energie_regen_min * 60000, s = T.sangfroid_regen_min * 60000;
  // on avance par pas entiers pour garder le reste
  var gE = Math.floor(dt / e), gS = Math.floor(dt / s);
  var avantE = t.energie, avantS = t.sangfroid;
  t.energie = Math.min(T.energie_max, t.energie + gE);
  t.sangfroid = Math.min(T.sangfroid_max, t.sangfroid + gS);
  // le plus lent des deux fixe la nouvelle référence, sans perdre de recharge en cours
  t.maj = (t.energie >= T.energie_max && t.sangfroid >= T.sangfroid_max) ? now : now - (dt % e);
  if (resume) {
    resume.energie = t.energie - avantE; resume.sangfroid = t.sangfroid - avantS;
    if (resume.energie > 0 || resume.sangfroid > 0) G.absence = resume;
  }
  return resume;
}

/** Minutes avant le prochain point d'énergie (affichage). */
function prochainPoint() {
  var T = B.temps;
  if (G.temps.energie >= T.energie_max) return 0;
  var e = T.energie_regen_min * 60000;
  return Math.max(1, Math.ceil((e - ((CLOCK.now() - G.temps.maj) % e)) / 60000));
}

/** Dépense : retourne false si pas assez. */
function depenser(cout) {
  cout = cout || {};
  if ((cout.energie || 0) > G.temps.energie || (cout.sangfroid || 0) > G.temps.sangfroid) return false;
  G.temps.energie -= cout.energie || 0;
  G.temps.sangfroid -= cout.sangfroid || 0;
  return true;
}

/* ---- 30-monde.js ---- */
/* CHOUF — 30-monde : missions, événements (cartes à choix, comme G.card dans KICK),
   engagements, et clôture de la semaine. */

/* ---------------- Missions ---------------- */

/** Missions disponibles dans la zone courante pour le chapitre courant. */
function missionsDispo() {
  var ch = IDX.chapitres[G.chapitre].i;
  return D.missions.liste.filter(function (m) {
    return (m.zone === "*" ? G.zone === G.protagoniste.zone_origine : m.zone === G.zone) &&
      IDX.chapitres[m.chapitre_min].i <= ch && (!m.condition || cond(m.condition));
  });
}
/** Niveau de maîtrise d'une mission (0..3). */
function maitrise(id) {
  var n = G.maitrise[id] || 0;
  return n >= 8 ? 3 : n >= 4 ? 2 : n >= 1 ? 1 : 0;
}
/** Convertit une clé de gain de mission en effet. */
function cleEffet(k, v) {
  if (k === "propre" || k === "sale") return "argent:" + k + (v >= 0 ? "+" : "") + v;
  if (k === "enquete") return "police:enquete" + (v >= 0 ? "+" : "") + v;
  return k + (v >= 0 ? "+" : "") + v;
}
/** Fait une mission. Retourne {ok, texte}. */
function faireMission(id) {
  var m = IDX.missions[id];
  if (!m) return { ok: false, texte: "Mission inconnue." };
  if (!depenser(m.cout)) return { ok: false, texte: "Pas assez d'énergie." };
  var bonus = 1 + 0.25 * maitrise(id);
  Object.keys(m.gains).forEach(function (k) {
    var v = m.gains[k];
    if (k === "propre" || k === "sale") v = Math.round(v * bonus);
    effet(cleEffet(k, v), {}, fillTexte(m.nom));
  });
  Object.keys(m.risques || {}).forEach(function (k) { effet(cleEffet(k, m.risques[k]), {}, m.nom); });
  if (m.fait && !G.evenements.faits[m.fait]) G.evenements.faits[m.fait] = { a: nowWk() };
  G.maitrise[id] = (G.maitrise[id] || 0) + 1;
  G.semaine_actions++;
  log(fillTexte(m.nom) + ".", "mission");
  save();
  return { ok: true, texte: fillTexte(m.voix || m.nom) };
}

/* ---------------- Engagements ---------------- */

function engagementsOuverts() {
  return G.protagoniste.engagements.filter(function (e) { return e.tenu === null; });
}
/** Tenir une promesse : coûte de l'énergie, renforce la confiance. */
function tenirEngagement(i) {
  var e = engagementsOuverts()[i];
  if (!e || !depenser({ energie: B.engagements.cout_tenir_energie })) return false;
  e.tenu = true;
  change("relation:" + e.envers + ".confiance", 6, "Promesse tenue");
  memoriser(e.envers + ":promesse_tenue");
  log("Tu as tenu ta promesse à " + pnjNom(e.envers) + ".", "engagement");
  G.semaine_actions++;
  save();
  return true;
}

/* ---------------- Événements ---------------- */

/** Peut-on tirer cet événement maintenant ? */
function evenementPossible(ev, ctx) {
  if (ev.once && G.evenements.faits[ev.id]) return false;
  var vu = G.evenements.vus[ev.id];
  if (vu != null && ev.delai_retour && nowWk() - vu < ev.delai_retour) return false;
  if (vu != null && !ev.delai_retour && ev.once !== false && ev.declencheur !== "programme") return false;
  return conds(ev.conditions, ctx);
}
/** Met un événement dans la file des cartes. */
function empiler(id, ctx) {
  G.file.push({ id: id, ctx: ctx || {} });
  G.evenements.vus[id] = nowWk();
}
/** Ouvre la carte suivante de la file. */
function carteSuivante() {
  if (G.carte || !G.file.length) return G.carte;
  G.carte = G.file.shift();
  return G.carte;
}
/** Options visibles d'une carte (celles dont la condition est remplie). */
function optionsCarte(c) {
  var ev = IDX.evenements[c.id];
  return ev.options.map(function (o, i) { return { o: o, i: i }; })
    .filter(function (x) { return !x.o.condition || cond(x.o.condition, c.ctx); });
}
/** Le joueur choisit l'option i (index dans ev.options). */
function choisir(i) {
  var c = G.carte;
  if (!c) return;
  var ev = IDX.evenements[c.id], o = ev.options[i];
  (o.effets || []).forEach(function (e) { effet(e, c.ctx, ev.titre); });
  memoriser(o.memoire, c.ctx);
  memoriser(ev.memoire, c.ctx);
  (o.programme || []).forEach(function (p) { programmer(p.id, p.dans, c.ctx); });
  G.evenements.faits[ev.id] = { a: nowWk(), option: i };
  if (ev.irreversible || o.irreversible) G.progression.irreversibles.push(ev.id);
  log(ev.titre + " — " + o.t + ".", "choix");
  G.carte = null;
  carteSuivante();
  save();
}

/** Événements fixés au calendrier (date précise). */
function declencherCalendrier() {
  D.evenements.liste.forEach(function (ev) {
    if (ev.declencheur === "calendrier" && ev.quand && wk(ev.quand) === nowWk() && evenementPossible(ev, {})) empiler(ev.id, {});
  });
  carteSuivante();
}

/** Rendez-vous de la ville actifs cette semaine (match de l'OM, mistral…). */
function villeCetteSemaine() {
  var s = G.cal.semaine, out = [];
  D.calendrier.ville.forEach(function (v) {
    if (v.semaines && (v.semaines.length === 1 ? s === v.semaines[0] : s >= v.semaines[0] && s <= v.semaines[1])) out.push(v.id);
    else if (v.frequence === "tous_les_15_jours_aout_mai" && (s >= 32 || s <= 21) && s % 2 === 0) out.push(v.id);
    else if (v.proba_semaine && rnd() < v.proba_semaine) out.push(v.id);
  });
  return out;
}

/* ---------------- Clôture de la semaine ---------------- */

/** Résout la semaine et passe à la suivante. Retourne le bilan affichable. */
function cloreSemaine() {
  if (G.carte) return null;                      // une décision attend
  var bilan = { lignes: [], cartes: 0 };
  var E = B.evenements, Z = B.zones;

  // 1. engagements échus
  G.protagoniste.engagements.forEach(function (e) {
    if (e.tenu === null && nowWk() >= e.echeance) {
      e.tenu = false;
      memoriser(e.envers + ":promesse_rompue");
      bilan.lignes.push("Tu n'as pas tenu ta promesse à " + pnjNom(e.envers) + ".");
      programmer("promesse_oubliee", 1, { pnj: e.envers });
    }
  });

  // 2. police : l'attention retombe lentement
  change("police:enquete", -B.police.enquete_baisse_semaine);

  // 3. zones : l'humeur revient vers la moyenne, la tension retombe
  Object.keys(G.zones).forEach(function (id) {
    var z = G.zones[id];
    z.humeur += (Z.humeur_derive_vers - z.humeur) * Z.humeur_derive / 10;
    z.tension = clamp(z.tension + Z.tension_derive, 0, 100);
  });

  // 4. relations : sans contact, la proximité baisse
  Object.keys(G.relations).forEach(function (id) {
    var r = G.relations[id];
    if (nowWk() - (r.contact || 0) > B.relations.semaines_sans_contact_avant_derive) r.proximite = clamp(r.proximite + B.relations.derive_proximite_sans_contact, 0, 100);
  });

  // 5. stress et santé
  var et = G.protagoniste.etat, S = B.stress;
  et.stress = clamp(et.stress + S.par_semaine_base + (G.semaine_actions === 0 ? S.repos_semaine : 0) + (G.police.enquete >= B.police.seuil_indice ? S.par_enquete_connue : 0), 0, 100);
  if (et.stress >= S.seuil_sante) { et.sante = clamp(et.sante - S.perte_sante_si_seuil, 0, 100); bilan.lignes.push("Tu dors mal. Ta santé baisse."); }

  // 6. avancer le calendrier
  var avantCh = G.chapitre, avantAge = age();
  var n = nowWk() + 1, c = wkToCal(n);
  G.cal.annee = c.annee; G.cal.semaine = c.semaine;
  G.semaine_actions = 0;
  G.temps.energie = Math.min(B.temps.energie_max, G.temps.energie + B.temps.energie_par_semaine);
  G.temps.sangfroid = Math.min(B.temps.sangfroid_max, G.temps.sangfroid + B.temps.sangfroid_par_semaine);
  if (age() > avantAge) bilan.lignes.push("Tu as " + age() + " ans.");
  majChapitre();
  if (G.chapitre !== avantCh) bilan.lignes.push("Nouveau chapitre : " + IDX.chapitres[G.chapitre].nom + ".");

  // 7. cartes : programmées, calendrier, rendez-vous de ville, seuils, tirage
  var max = E.cartes_max_par_semaine;
  function pousse(id, ctx) { if (bilan.cartes < max) { empiler(id, ctx); bilan.cartes++; } }
  G.evenements.programmes = G.evenements.programmes.filter(function (p) {
    if (p.a > nowWk()) return true;
    var ev = IDX.evenements[p.id];
    if (ev && bilan.cartes < max && evenementPossible(ev, p.ctx)) { pousse(p.id, p.ctx); return false; }
    return bilan.cartes >= max;                  // garde pour la semaine suivante si la file est pleine
  });
  D.evenements.liste.forEach(function (ev) {

  p.x = e.clientX; p.y = e.clientY;
  cancelAnimationFrame(PLAN.raf); PLAN.raf = requestAnimationFrame(planDessin);
}
function planUp(e) {
  var p = PLAN.ptr[e.pointerId];
  delete PLAN.ptr[e.pointerId];
  if (!p || Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 8 || Date.now() - p.t > 450) return;
  var rc = PLAN.el.getBoundingClientRect(), sx = e.clientX - rc.left, sy = e.clientY - rc.top;
  var id = zoneSous(sx, sy);
  UI.sel = id || null;
  render();
}
/** Zone sous un point de l'écran (badges d'abord, puis sol). */
function zoneSous(sx, sy) {
  for (var i = 0; i < (PLAN.hits || []).length; i++) { var h = PLAN.hits[i]; if (Math.hypot(sx - h.x, sy - h.y) <= h.r) return h.z; }
  var cam = PLAN.cam, el = PLAN.el, ox = (sx - el.clientWidth / 2) / cam.z + cam.x, oy = (sy - el.clientHeight / 2) / cam.z + cam.y;
  var w = deproj(PLAN.cache.P, ox, oy);
  var z = D.zones.liste.filter(function (z) { return dansPoly(w, z.plan); })[0];
  return z ? z.id : null;
}
/** Part de la ville tenue par chaque équipe (pondérée par la population). */
function partsVille() {
  var t = {}, tot = 0;
  D.zones.liste.forEach(function (z) { var c = G.zones[z.id].controle || "aucun"; t[c] = (t[c] || 0) + z.population; tot += z.population; });
  return Object.keys(t).map(function (k) { return { id: k, p: t[k] / tot }; }).sort(function (a, b) { return b.p - a.p; });
}

/* ---- 60-ui.js ---- */
/* CHOUF — 60-ui : écrans. Même principe que KICK : TAB + SUB, go(), render() par table d'écrans.
   Aucune règle de jeu ici : l'interface appelle les fonctions des modules 00 à 30. */

var TAB = "quartier", SUB = null, UI = { creation: null, toast: null, bilan: null };
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

/** Images : ASSETS est injecté par build.py (index des planches découpées). Sinon, aplat. */
var ASSET = {
  u: function (k) { var a = window.ASSETS || {}; return a[k] || null; },
  img: function (k, cls) {
    var u = ASSET.u(k);
    return u ? '<img class="' + (cls || "") + '" src="' + u + '" alt="">' : '<div class="' + (cls || "") + ' ph ph-' + esc(k.split("_")[0]) + '"></div>';
  }
};

/** Explications contextuelles des indicateurs (GDD V7 §6 : chiffré, jamais sans explication). */
var EXPL = {
  tension: [[25, "Calme. Les gens se parlent dans le hall."], [50, "Quelques embrouilles, rien d'ouvert."], [75, "Ça se regarde de travers. Les mères rentrent les enfants tôt."], [101, "Ça peut éclater à tout moment."]],
  police: [[25, "On ne voit presque jamais de patrouille."], [50, "Une voiture passe de temps en temps."], [75, "Contrôles réguliers, les guetteurs sont sur les nerfs."], [101, "La police est là tous les jours."]],
  humeur: [[25, "Le quartier n'en peut plus des réseaux."], [50, "Les gens se taisent, mais ils n'en pensent pas moins."], [75, "On laisse faire, tant que ça reste discret."], [101, "Beaucoup comptent sur l'argent qui circule."]],
  stress: [[25, "Tu dors bien."], [50, "Ça tourne un peu dans ta tête le soir."], [75, "Tu sursautes au moindre bruit d'escalier."], [101, "Tu ne dors plus."]],
  confiance: [[25, "Ne te croit plus."], [50, "Se méfie."], [75, "Te fait plutôt confiance."], [101, "Compte sur toi."]]
};
function expl(k, v) { var t = EXPL[k]; for (var i = 0; i < t.length; i++) if (v < t[i][0]) return t[i][1]; return ""; }
function jauge(v, cls) { return '<div class="jauge ' + (cls || "") + '"><i style="width:' + clamp(v, 0, 100) + '%"></i></div>'; }
function euros(n) { return Math.round(n).toLocaleString("fr-FR") + " €"; }

function couleurEquipe(id) { return id === "joueur" ? B.carte.couleur_joueur : id && IDX.equipes[id] ? IDX.equipes[id].couleur : B.carte.couleur_neutre; }

/* ---------------- Événements d'interface ---------------- */

function onClick(ev) {
  var t = ev.target.closest("[data-a],[data-tab],[data-mission],[data-opt],[data-pnj],[data-eng]");
  if (!t) return;
  var d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.pnj) return setSub("pnj:" + d.pnj);
  if (d.opt != null) { choisir(+d.opt); return render(); }
  if (d.eng != null) { if (!tenirEngagement(+d.eng)) toast("Pas assez d'énergie."); return render(); }
  if (d.mission) { var r = faireMission(d.mission); toast(r.texte); return; }
  switch (d.a) {
    case "nouvelle":
      var pr = ($("#prenom") || {}).value || "";
      UI.creation = { prenom: pr, G: newGame(pr) }; G = null; return render();
    case "retirer": UI.creation = { prenom: UI.creation.prenom, G: newGame(UI.creation.prenom) }; G = null; return render();
    case "commencer": G = UI.creation.G; UI.creation = null; TAB = "quartier"; save(); return render();
    case "continuer": if (loadSave()) { TAB = "quartier"; } return render();
    case "clore": UI.bilan = cloreSemaine(); return render();
    case "okbilan": UI.bilan = null; return render();
    case "okabsence": G.absence = null; save(); return render();
    case "retour": SUB = null; return render();
    case "ouvrirzone": if (UI.sel === G.protagoniste.zone_origine) return go("quartier"); UI.zoneVue = UI.sel; return setSub("zone");
    case "fermersel": UI.sel = null; return render();
    case "zplus": zoomer(1.25); return;
    case "zmoins": zoomer(0.8); return;
    case "effacer":
      if (!UI.confirmeEffacer) { UI.confirmeEffacer = true; toast("Touche encore une fois pour effacer cette vie."); setTimeout(function () { UI.confirmeEffacer = false; }, 4000); return; }
      UI.confirmeEffacer = false; eraseSave(); UI.creation = null; return render();
  }
}

/** Démarrage : écouteurs et premier affichage. */
function boot() {
  document.addEventListener("click", onClick);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && G) render(); });
  setInterval(function () { if (G && !G.carte && !UI.bilan && document.activeElement.tagName !== "INPUT") render(); }, 30000);
  render();
}

if (!window.__NOBOOT__) boot();
</script>
