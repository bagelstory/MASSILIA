<style>

.btn.sec{background:var(--nuit3);color:var(--craie);font-weight:500}.btn.opt{background:var(--nuit3);color:var(--craie);text-align:left;font-weight:500}
.jauge{height:6px;background:var(--nuit3);border-radius:3px;overflow:hidden;margin:4px 0}.jauge i{display:block;height:100%;background:var(--sodium)}

.indic{margin:10px 0}.indic .ligne{display:flex;justify-content:space-between;font-size:14px}

.clore{margin-top:22px}
.banniere{width:calc(100% + 28px);margin:0 -14px;height:150px;object-fit:cover;display:block}
.ph{background:linear-gradient(135deg,#34373c,#141517 60%,#3a2c18)}.ph-medaillon{background:radial-gradient(circle at 50% 40%,#45484e,#1c1d20);border:2px solid #5a5e66}
.ph-scene{background:linear-gradient(160deg,#3a3d42,#141517 70%,#4a3414)}
.plan{width:100%;display:block;border-radius:var(--r)}.plan .mer{fill:#0f2a4d}.plan .terre{fill:#1a2138}
.plan .zone{stroke:#0b1020;stroke-width:2;fill:#232c4a;cursor:pointer}.plan .zone.c1,.plan .zone.c2{fill:#2f3c66}.plan .zone.c3,.plan .zone.c4{fill:#5b4a2e}
.plan .zone.chez{fill:#8a5a22}.plan .zone.ici{stroke:var(--sodium);stroke-width:3}
.plan .lbl{fill:var(--craie);font-size:9.5px;text-anchor:middle;pointer-events:none;font-weight:600}.plan .mer-lbl{fill:#5f86b8;font-style:italic;text-anchor:start}
.legende .pt{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle}.pt.c3{background:#8a5a22}.pt.c1{background:#2f3c66}.pt.c0{background:#232c4a}
.retour{color:var(--sodium);padding:8px 0;font-size:15px}
.pnj{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--nuit2);border-radius:var(--r);padding:10px 12px;margin:6px 0}
.pnj span{flex:1}.pnj small{display:block;color:var(--gris);font-size:12px}
.med{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}.med.grand{width:96px;height:96px;margin:6px auto;display:block}
.fiche{text-align:center}.fiche p{text-align:left}.mem{padding-left:18px}
.journal{list-style:none;padding:0}.journal li{padding:8px 0;border-bottom:1px solid var(--nuit3);font-size:14px}.journal small{color:var(--gris)}.journal em{color:var(--gris)}
.journal .choix{color:var(--craie)}.journal .chiffre{color:var(--gris);font-size:13px}.journal .chapitre{color:var(--sodium)}
.voile{position:fixed;inset:0;background:rgba(5,8,18,.78);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--nuit2);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:10px 0 6px}.scene{width:100%;height:170px;border-radius:12px;object-fit:cover;display:block}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--craie);color:var(--nuit);padding:10px 16px;border-radius:12px;max-width:92%;z-index:20;font-size:14px}
.accueil{padding:40px 20px}.titre{font-size:56px;letter-spacing:.2em;margin:30px 0 0;color:var(--sodium)}.sous{color:var(--gris);margin-top:0}
.avert{font-size:13px;color:var(--gris);border-left:3px solid var(--sodium);padding-left:10px}
.champ{display:block;margin:18px 0 0;font-size:13px;color:var(--gris)}.champ input{display:block;width:100%;margin-top:6px;padding:13px;border-radius:12px;border:1px solid var(--nuit3);background:var(--nuit2);color:var(--craie);font:inherit}
.carte-bloc{background:var(--nuit2);border-radius:var(--r);padding:14px;margin:18px 0}
.vue-ville{position:relative;margin:0 -14px;height:calc(100vh - 210px);min-height:420px;overflow:hidden;background:#0d151b}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud-haut{position:absolute;top:8px;left:10px;right:10px;background:rgba(17,18,20,.82);border:1px solid #3a3d42;border-radius:12px;padding:8px 10px;pointer-events:none}
.hud-titre{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sodium);font-weight:700}
.parts{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 5px;background:#2c2e33}.parts i{display:block;height:100%}
.hud-leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:#c9cbd0}.hud-leg b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.hud-zoom{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.hud-zoom button{width:38px;height:38px;border-radius:50%;background:rgba(17,18,20,.85);border:2px solid #5a5e66;font-size:20px;font-weight:700}
.hud-bas{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(17,18,20,.92);border:1px solid #3a3d42;border-top:3px solid var(--sodium);border-radius:12px;padding:10px 12px}
.hud-bas.petit-hb{border-top-width:1px;font-size:12px;color:var(--gris);text-align:center;padding:8px}

.hb-ctrl{font-size:13px;margin:4px 0}.hb-ctrl b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.hb-stats{display:flex;gap:14px;font-size:12px;color:var(--gris)}.hb-stats b{color:var(--craie)}
.hb-txt{font-size:13px;margin:6px 0 4px;color:#d7d8db}.hb-btns{display:flex;gap:8px}.hb-btns .btn{margin:6px 0 0;padding:10px}
.ico{width:20px;height:20px;vertical-align:-5px}

.vue-ville{height:calc(100vh - 230px);min-height:380px;margin:0}

/** Hasard de la partie (mulberry32), son état tient dans G.seed : une partie rejouée avec la même graine est identique. */

/* CHOUF v2 — 10-ville : les quartiers de Marseille (noms officiels de data/zones.json), leur découpage sur
   le plan, leurs voisinages, leur contrôle (joueur et factions), et la mise en place d'une partie.
   Le découpage est un schéma : chaque zone de jeu est partagée entre ses quartiers par regroupement de
   points (pas les frontières officielles exactes). Il ne dépend pas de la partie (hasard du décor). */

function rngDecor(txt) {
  var h = 2166136261;
  for (var i = 0; i < txt.length; i++) h = Math.imul(h ^ txt.charCodeAt(i), 16777619);
  return function () { h = (h + 0x6D2B79F5) | 0; var t = Math.imul(h ^ (h >>> 15), h | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

/** La ville : les 111 quartiers officiels (data/quartiers.json, tools/geo.py), rastérisés sur une grille du plan.

    var o = { id: Q.id, zone: Q.zone, nom: Q.nom, arr: Q.arr, cx: 0, cy: 0, n: 0, cells: [] };
    for (var x = Math.floor(Math.min.apply(0, xs) / PAS) * PAS; x <= Math.max.apply(0, xs); x += PAS)
      for (var y = Math.floor(Math.min.apply(0, ys) / PAS) * PAS; y <= Math.max.apply(0, ys); y += PAS) {

  var iles = ordre.filter(function (id) { return q[id].nom === "Les Îles"; })[0];

function quartierEn(x, y) {

/* ---------- état des quartiers ---------- */
function advTotal(s) { var t = 0; for (var f in s.adv) t += s.adv[f]; return t; }

/** libre · joueur · securise · conteste · faction (règles §3.3). */
function statut(id) {

  if (s.ctl >= C.securise_controle && a <= C.securise_adverse) return "securise";
  if (s.ctl > 0 && a > 0.5) return "conteste";

/** Le joueur peut-il y envoyer un opérateur ? (§3.4 : voisin à 50 % ou plus, ou déjà présent) */
function accessible(id, tache) {

  if (!zoneOuverte(VILLE.q[id].zone)) return false;

/** Part de la ville contrôlée par le joueur (moyenne des contrôles). */
function territoire() {

/** Ajoute du contrôle au joueur : d'abord la part libre, puis aux dépens des factions (à moitié). */
function gagnerControle(id, v) {

/** Une faction gagne de la présence : part libre, puis aux dépens du joueur et des autres (sauf alliées). */
function gagnerPresence(id, f, v) {
  var s = G.q[id], libre = libreDe(s), pris = Math.min(v, libre), perteJoueur = 0;
  s.adv[f] = (s.adv[f] || 0) + pris; v -= pris;
  if (v > 0) {
    var cibles = s.ctl;
    for (var g in s.adv) if (g !== f && !allies(f, g)) cibles += s.adv[g];
    if (cibles > 0) {
      var prise = Math.min(cibles, v);
      perteJoueur = prise * s.ctl / cibles;
      s.ctl = Math.max(0, s.ctl - perteJoueur);
      for (var h in s.adv) if (h !== f && !allies(f, h)) s.adv[h] = Math.max(0, s.adv[h] - prise * s.adv[h] / cibles);
      s.adv[f] += prise;
    }
  }
  return perteJoueur;
}
function allies(a, b) {
  return G.alliances.some(function (x) { return (x.a === a && x.b === b) || (x.a === b && x.b === a); });
}

/** Revenu et coût d'un quartier pour ce cycle (saisons comprises). */
function multSaison(id) {
  var m = 1, z = VILLE.q[id].zone;
  (G.saisons || []).forEach(function (sid) {
    var s = B.evenements.saisons.filter(function (x) { return x.id === sid; })[0];
    if (s && (s.zones === "*" || s.zones.indexOf(z) >= 0)) m *= s.flux_mult;
  });
  return m;
}

/* ---------- nouvelle partie ---------- */
/** Prépare une ville et un réseau de départ. seed : facultatif (tests). */
function newGame(seed) {
  var Dp = B.depart, Q = B.quartiers;
  G = { v: 2, seed: (seed == null ? (Date.now() & 0x7fffffff) : seed) | 0 };
  G.cycle = 1; G.tresorerie = Dp.tresorerie; G.dette = 0; G.cycles_zero = 0;
  G.capacite = Dp.capacite; G.seuils_pris = []; G.ind = { pression: 15, stabilite: 55, exposition: 5 };
  G.operateurs = []; G.prochain_op = 1; G.visages = B.operateurs.visages.slice();
  G.factions = {}; G.alliances = []; G.flux = []; G.journal = []; G.rapport = null; G.fini = null; G.saisons = [];
  G.historique = []; G.quetesFaites = {}; G.zonesOuvertes = [];
  D.equipes.liste.forEach(function (e) {
    G.factions[e.id] = { id: e.id, budget: e.budget, effectif: e.effectif, agressivite: e.agressivite, objectif: "maintenir", cible: null,
      vivante: true, pic: 0, intention: null };
  });
  G.q = {};
  VILLE.ordre.forEach(function (id) {
    var z = IDX.zones[VILLE.q[id].zone];
    var s = { ctl: 0, adv: {}, conn: 0, ch: genererCharbons(id), inv: 0, sans_op: 0 };
    s.maintien = Math.round(s.ch.reduce(function (t, c) { return t + c.rent; }, 0) * B.charbons.maintien_ratio / 10) * 10 + 40;
    if (z.controle) s.adv[z.controle] = rint(Q.presence_faction[0], Q.presence_faction[1]);
    else D.equipes.liste.forEach(function (e) { if (rnd() < 0.3) s.adv[e.id] = rint(Q.presence_neutre[0], Q.presence_neutre[1]); });
    G.q[id] = s;
  });
  // présences voisines sur les bords des zones
  VILLE.ordre.forEach(function (id) {
    VILLE.adj[id].forEach(function (v) {
      var zc = IDX.zones[VILLE.q[v].zone].controle;
      if (zc && VILLE.q[v].zone !== VILLE.q[id].zone && !G.q[id].adv[zc] && rnd() < 0.5) G.q[id].adv[zc] = rint(Q.presence_voisine[0], Q.presence_voisine[1]);
    });
  });
  VILLE.ordre.forEach(function (id) { var s = G.q[id], a = advTotal(s); if (a > 100) for (var f in s.adv) s.adv[f] *= 100 / a; });
  // les factions tiennent les charbons là où elles sont fortes
  VILLE.ordre.forEach(function (id) {
    var s = G.q[id], dom = factionDominante(s);
    s.ch.forEach(function (c) { if (dom && s.adv[dom] >= 30) { c.proprio = dom; c.ouvert = true; } });
  });
  // base du joueur
  var zones = D.zones.liste.filter(function (z) { return z.depart; });
  var zb = pick(zones), qs = VILLE.zones[zb.id].slice();
  var cand = qs.filter(function (id) { return G.q[id].ch.length; });
  var base = pick(cand.length ? cand : qs), sb = G.q[base];
  G.zonesOuvertes = [zb.id];
  var nb = Dp.charbons_base, essai = 0;
  while (sb.ch.length < nb && essai++ < 10) sb.ch = sb.ch.concat(genererCharbons(base)).slice(0, Math.max(nb, sb.ch.length));
  sb.ch.forEach(function (c, i) { c.proprio = i < nb ? "joueur" : null; c.ouvert = i < nb; });
  G.base = base;
  sb.adv = {}; if (zb.controle) sb.adv[zb.controle] = Dp.presence_base_adverse;
  sb.ctl = Dp.controle_base; sb.conn = Dp.connaissance_base;
  qs.forEach(function (id) { G.q[id].conn = Math.max(G.q[id].conn, Dp.connaissance_zone); });
  VILLE.adj[base].forEach(function (id) { G.q[id].conn = Math.max(G.q[id].conn, 1); });
  Dp.operateurs.forEach(function (t) { creerOperateur(t, base, rint(Dp.competence[0], Dp.competence[1])); });
  D.equipes.liste.forEach(function (e) { G.factions[e.id].pic = territoireFaction(e.id).length; });
  log("Cycle 1. Ton réseau tient " + VILLE.q[base].nom + " (" + IDX.zones[zb.id].nom + ").", "debut", base);
  return G;
}
/** Quartiers où une faction a 30 % ou plus (§5.2). */
function territoireFaction(f) {
  return VILLE.ordre.filter(function (id) { return (G.q[id].adv[f] || 0) >= 30; });
}

/* ---- 20-operateurs.js ---- */
/* CHOUF v2 — 20-operateurs : recrutement, affectation (quartier + tâche), transit, fatigue, efficacité.
   Un opérateur est une fonction (§4) ; il porte un numéro, un visage et un surnom pris dans les personnages
   adultes du jeu, mais il n'a ni dialogue ni mémoire. */

function TYPES() { return B.operateurs.types; }

function creerOperateur(type, qid, comp) {
  var O = B.operateurs, visage = G.visages.length ? G.visages.shift() : null;
  var op = { id: "OP-" + ("00" + G.prochain_op++).slice(-3), type: type, comp: comp || rint(O.competence_recrue[0], O.competence_recrue[1]),
    xp: 0, fatigue: 0, dispo: "disponible", pos: qid, dest: null, transit: 0, tache: "repos", indispo: 0, visage: visage };
  G.operateurs.push(op);
  return op;
}
function opsActifs() { return G.operateurs.filter(function (o) { return o.dispo !== "perdu"; }); }
function opParId(id) { return G.operateurs.filter(function (o) { return o.id === id; })[0]; }
function nomOp(o) { return o.id + (o.visage && IDX.personnages[o.visage] ? " « " + (IDX.personnages[o.visage].surnom || IDX.personnages[o.visage].prenom) + " »" : ""); }

/** Coût de recrutement, et raison du refus éventuel (capacité §7, trésorerie §6.3). */
function peutRecruter(type) {
  var c = TYPES()[type].recrutement;
  if (opsActifs().length >= G.capacite) return { ok: false, raison: "Capacité atteinte (" + G.capacite + ")" };
  if (G.tresorerie < c) return { ok: false, raison: "Trésorerie insuffisante" };
  return { ok: true, cout: c };
}
function recruter(type) {
  var r = peutRecruter(type);
  if (!r.ok) return r;
  G.tresorerie -= r.cout;
  var op = creerOperateur(type, G.base);
  G.ind.stabilite = clamp(G.ind.stabilite + B.indicateurs.stabilite_recrue, 0, 100);
  log("Recrue : " + nomOp(op) + ", " + TYPES()[type].nom + " (−" + r.cout + " €).", "recrue", G.base);
  save();
  return { ok: true, op: op };
}

/** Distance en cycles entre deux quartiers (§4.4 : 1 si voisin, 2 sinon, 0 sur place). */
function dureeTransit(a, b) {
  if (a === b) return 0;
  return VILLE.adj[a].indexOf(b) >= 0 ? B.operateurs.transit_adjacent : B.operateurs.transit_loin;
}
/** Efficacité d'un opérateur sur une tâche (§4.4 spécialisation, fatigue, stabilité). */
function efficacite(o, tache) {
  var t = B.taches[tache], O = B.operateurs;
  if (!t || !t.type) return 0;
  var e = o.comp / O.competence_ref;
  if (t.type !== o.type) e *= O.hors_specialite;
  if (o.fatigue >= O.fatigue_seuil_baisse) e *= O.fatigue_effet;
  return r1(e);
}
/** Affecte un opérateur à un quartier et une tâche pour le cycle à venir. */
function affecter(opId, qid, tache) {
  var o = opParId(opId);
  if (!o || o.dispo === "perdu") return { ok: false, raison: "Opérateur indisponible" };
  if (o.dispo === "indisponible") return { ok: false, raison: "Épuisé : au repos ce cycle" };
  if (qid !== o.pos && !accessible(qid, tache)) return { ok: false, raison: "Quartier inaccessible : il faut un voisin à " + B.controle.acces_voisin + " %" };
  o.tache = tache;
  if (qid !== o.pos) { o.dest = qid; o.transit = dureeTransit(o.pos, qid); o.dispo = "transit"; }
  else { o.dest = null; o.transit = 0; o.dispo = tache === "repos" ? "disponible" : "occupe"; }
  save();
  return { ok: true };
}
/** Quartier où l'opérateur agira (destination s'il voyage). */
function lieuOp(o) { return o.dest || o.pos; }

/* ---- 30-factions.js ---- */
/* CHOUF v2 — 30-factions : l'IA des équipes rivales (§5). Chaque cycle, chaque faction :
   gagne et dépense, recrute lentement, choisit un objectif (contre-attaquer, se rétracter, étendre, maintenir),
   agit sur un ou plusieurs quartiers. Alliances temporaires, fragmentation, disparition. */

function forceAction(f) {
  var a = B.factions.force_action;
  var h = B.factions.force_hasard;
  return (a[0] + f.agressivite * a[1] + f.effectif * a[2]) * rf(h[0], h[1]);
}
/** Revenu d'une faction : ses quartiers selon sa présence. */
function revenuFaction(fid) {
  var t = 0;
  VILLE.ordre.forEach(function (id) { t += fluxQuartier(id) * (G.q[id].adv[fid] || 0) / 100; });
  return t * B.factions.revenu_ratio;
}
/** Défense du joueur dans un quartier (opérateurs Force sur place, surveillance). */
function defense(id) {
  var red = 0;
  opsActifs().forEach(function (o) {
    if (o.dispo === "transit" || o.pos !== id) return;
    if (o.tache === "securiser") red += B.controle.force_reduit_attaque * efficacite(o, "securiser");
    if (o.tache === "surveiller") red += B.taches.surveiller.reduction_attaque * efficacite(o, "surveiller");
  });
  return clamp(red, 0, 0.85);
}

/** Choisit l'objectif et la cible d'une faction (§5.3). Retourne la liste des quartiers visés. */
function decider(fid) {
  var f = G.factions[fid], F = B.factions, terr = territoireFaction(fid), cibles = [];
  var eqp = IDX.equipes[fid];
  // attaquée : un de ses quartiers où le joueur dépasse le seuil
  // attaquée : un quartier de son territoire où le joueur dépasse le seuil (pas pendant la période calme du début)
  var attaques = G.cycle <= F.periode_calme ? [] : terr.filter(function (id) { return G.q[id].ctl > F.attaque_detecte; });
  attaques = attaques.filter(function () { return rnd() < f.agressivite * F.proba_contre_par_agressivite + 0.1; });
  if (attaques.length) { f.objectif = "contre"; cibles = attaques; }
  else if (f.budget < F.budget_max * F.retraite_budget * (eqp.budget / F.budget_max + 0.5)) { f.objectif = "retraite"; cibles = []; }
  else {
    // faiblesse : quartier voisin de son territoire, libre ou peu tenu par le joueur
    var voisins = {};
    terr.forEach(function (id) { VILLE.adj[id].forEach(function (v) { if ((G.q[v].adv[fid] || 0) < 30) voisins[v] = 1; }); });
    var faibles = Object.keys(voisins).filter(function (v) {
      var s = G.q[v]; return (s.ctl <= 0 || G.cycle > F.periode_calme) && s.ctl < 40 && !Object.keys(s.adv).some(function (g) { return g !== fid && allies(fid, g) && s.adv[g] > 30; });
    });
    if (faibles.length && rnd() < 0.25 + f.agressivite * 0.12) {
      f.objectif = "etendre";
      faibles.sort(function (a, b) { return (G.q[a].ctl + advTotal(G.q[a])) - (G.q[b].ctl + advTotal(G.q[b])); });
      cibles = faibles;
    } else { f.objectif = "maintenir"; cibles = []; }
  }
  var n = Math.max(1, Math.ceil(f.effectif / F.actions_par_effectif));
  cibles = cibles.filter(function (id, i) { return cibles.indexOf(id) === i; }).slice(0, n);
  f.cible = cibles[0] || null;
  return cibles;
}

/** Fait jouer toutes les factions pour ce cycle. */
function tourFactions() {
  var F = B.factions, att = [];
  Object.keys(G.factions).forEach(function (fid) {
    var f = G.factions[fid];
    if (!f.vivante) return;
    f.budget = clamp(f.budget + revenuFaction(fid) - f.effectif * F.cout_effectif, 0, F.budget_max);
    if (f.effectif < F.effectif_max && f.budget > F.recrutement_seuil + F.recrutement_cout && rnd() < 0.25) { f.budget -= F.recrutement_cout; f.effectif++; }
    var cibles = decider(fid);
    if (f.objectif === "retraite") {
      // se concentre : abandonne un peu de présence dans ses quartiers les plus faibles
      VILLE.ordre.forEach(function (id) { var s = G.q[id]; if (s.adv[fid] && s.adv[fid] < 25) s.adv[fid] = Math.max(0, s.adv[fid] - 4); });
      if (f.agressivite > 1 && rnd() < 0.3) f.agressivite--;
    }
    if (f.objectif === "maintenir" && f.agressivite < IDX.equipes[fid].agressivite && rnd() < 0.2) f.agressivite++;
    cibles.forEach(function (id) {
      if (f.budget < F.cout_action) return;
      f.budget -= F.cout_action;
      var v = forceAction(f) * (1 - defense(id));
      var avant = G.q[id].ctl;
      var perte = gagnerPresence(id, fid, v);
      if (perte > 0.5) att.push({ f: fid, q: id, perte: perte, avant: avant });
      else if (avant === 0 && G.q[id].conn > 0 && v > 3 && rnd() < 0.3) log(IDX.equipes[fid].nom + " avance sur " + VILLE.q[id].nom + ".", "faction", id);
    });
    f.intention = cibles[0] ? { objectif: f.objectif, q: cibles[0] } : { objectif: f.objectif, q: null };
  });
  att.forEach(function (a) {
    log(IDX.equipes[a.f].nom + " attaque " + VILLE.q[a.q].nom + " : contrôle −" + Math.round(a.perte) + " %.", "attaque", a.q);
    if (G.q[a.q].ctl <= 0 && a.avant > 0) log(VILLE.q[a.q].nom + " est perdu.", "perte", a.q);
  });
  alliancesEtFragmentation();
}

function alliancesEtFragmentation() {
  var F = B.factions;
  G.alliances = G.alliances.filter(function (x) { return --x.reste > 0 || (log("Fin de la trêve entre " + IDX.equipes[x.a].nom + " et " + IDX.equipes[x.b].nom + ".", "faction"), false); });
  var vives = Object.keys(G.factions).filter(function (f) { return G.factions[f].vivante; });
  if (vives.length >= 2 && rnd() < F.alliance_proba) {
    var a = pick(vives), b = pick(vives.filter(function (x) { return x !== a; }));
    if (!allies(a, b)) {
      G.alliances.push({ a: a, b: b, reste: rint(F.alliance_duree[0], F.alliance_duree[1]) });
      log("Trêve entre " + IDX.equipes[a].nom + " et " + IDX.equipes[b].nom + ".", "faction");
    }
  }
  vives.forEach(function (fid) {
    var f = G.factions[fid], t = territoireFaction(fid).length;
    f.pic = Math.max(f.pic, t);
    var reste = VILLE.ordre.some(function (id) { return (G.q[id].adv[fid] || 0) > 1; });
    if (!reste) {
      f.vivante = false;
      log(IDX.equipes[fid].nom + " a disparu de la ville.", "disparition");
    } else if (!f.fragmentee && f.pic >= F.fragmentation_min && t > 0 && t <= f.pic * F.fragmentation_ratio) {
      f.fragmentee = true; f.effectif = Math.max(1, Math.round(f.effectif * 0.6)); f.agressivite = Math.min(5, f.agressivite + 1);
      log(IDX.equipes[fid].nom + " se divise : moins nombreux, plus nerveux.", "faction");
    }
  });
}

/* ---- 35-charbons.js ---- */
/* CHOUF v2 — 35-charbons : les points de vente de chaque quartier (abstraits : une rentabilité, un risque,
   un propriétaire), les zones verrouillées et les objectifs (quêtes chiffrées) qui les ouvrent. */

/* ---------- charbons ---------- */
/** Crée les charbons d'un quartier au début de la partie. */
function genererCharbons(id) {
  var C = B.charbons, z = IDX.zones[VILLE.q[id].zone], nb = C.nombre[z.bati.type] || [1, 2];
  var n = rint(nb[0], nb[1]), out = [], cells = VILLE.q[id].cells, r = rngDecor(id + ":ch");
  for (var i = 0; i < n; i++) {
    var ratio = rf(C.rentabilite_ratio[0], C.rentabilite_ratio[1]);
    var rent = Math.round(z.revenu * ratio / 10) * 10;
    var c = cells[Math.floor(r() * cells.length)];
    out.push({ nom: pick(C.noms), rent: rent, risque: ratio < C.risque_seuils[0] ? 1 : ratio < C.risque_seuils[1] ? 2 : 3,
      proprio: null, ouvert: false, saisi: 0, x: c[0] + 1, y: c[1] + 1 });
  }
  return out;
}
/** Potentiel d'un quartier : somme des rentabilités (sert aussi au revenu des factions). */
function fluxQuartier(id) {
  var s = G.q[id];
  return s.ch.reduce(function (t, c) { return t + c.rent; }, 0) * (1 + s.inv * B.quartiers.investir_gain);
}
function charbonsJoueur() {
  var n = 0;
  VILLE.ordre.forEach(function (id) { G.q[id].ch.forEach(function (c) { if (c.proprio === "joueur" && c.ouvert && !c.saisi) n++; }); });
  return n;
}
function coutCharbon(c) { return Math.round(c.rent * (c.proprio && c.proprio !== "joueur" ? B.charbons.reprise_ratio : B.charbons.ouverture_ratio)); }
/** Peut-on ouvrir ou reprendre ce charbon ? */
function peutCharbon(id, i) {
  var s = G.q[id], c = s.ch[i], C = B.charbons;
  if (!c) return { ok: false, raison: "?" };
  if (c.proprio === "joueur") return { ok: false, raison: "Déjà à toi" };
  if (c.saisi) return { ok: false, raison: "Saisi encore " + c.saisi + " cycle(s)" };
  if (!zoneOuverte(VILLE.q[id].zone)) return { ok: false, raison: "Zone verrouillée" };
  var reprise = c.proprio && c.proprio !== "joueur";
  var seuil = reprise ? C.seuil_reprise : C.seuil_ouverture;
  if (s.ctl < seuil) return { ok: false, raison: "Contrôle " + seuil + " % requis" };
  if (reprise && (s.adv[c.proprio] || 0) > s.ctl) return { ok: false, raison: "La faction est plus forte ici" };
  var cout = coutCharbon(c);
  if (G.tresorerie < cout) return { ok: false, raison: "Il faut " + cout + " €" };
  return { ok: true, cout: cout, reprise: reprise };
}
function prendreCharbon(id, i) {
  var r = peutCharbon(id, i);
  if (!r.ok) return r;
  var c = G.q[id].ch[i];
  G.tresorerie -= r.cout;
  if (r.reprise) { G.ind.pression = clamp(G.ind.pression + 3, 0, 100); G.ind.exposition = clamp(G.ind.exposition + 2, 0, 100); }
  log((r.reprise ? "Charbon repris à " + IDX.equipes[c.proprio].nom : "Charbon ouvert") + " : " + c.nom + ", " + VILLE.q[id].nom + " (−" + r.cout + " €).", "charbon", id);
  c.proprio = "joueur"; c.ouvert = true;
  verifierQuetes();
  save();
  return { ok: true };
}
function fermerCharbon(id, i) {
  var c = G.q[id].ch[i];
  if (!c || c.proprio !== "joueur") return;
  c.ouvert = !c.ouvert;
  log("Charbon " + (c.ouvert ? "rouvert" : "fermé") + " : " + c.nom + ", " + VILLE.q[id].nom + ".", "charbon", id);
  save();
}
/** Après le tour : les charbons suivent le rapport de force du quartier, la police en saisit. */
function majCharbons() {
  var C = B.charbons, E = B.evenements;
  VILLE.ordre.forEach(function (id) {
    var s = G.q[id], dom = factionDominante(s), z = IDX.zones[VILLE.q[id].zone];
    s.ch.forEach(function (c) {
      if (c.saisi) { c.saisi--; return; }
      if (c.proprio === "joueur" && s.ctl < C.perte_sous) {
        c.proprio = dom; c.ouvert = !!dom;
        log("Charbon perdu : " + c.nom + ", " + VILLE.q[id].nom + (dom ? " (" + IDX.equipes[dom].nom + ")" : "") + ".", "perte", id);
        return;
      }
      if (c.proprio && c.proprio !== "joueur" && (s.adv[c.proprio] || 0) < 5) { c.proprio = null; c.ouvert = false; }
      if (!c.proprio && dom && s.adv[dom] >= 30 && rnd() < 0.2) { c.proprio = dom; c.ouvert = true; }
      if (c.proprio === "joueur" && c.ouvert) {
        G.ind.pression += c.risque * C.pression_par_risque * 0.3;
        G.ind.exposition += c.risque * C.exposition_par_risque * 0.3;
        var p = C.saisie_base * c.risque * (G.ind.pression / 50) * (z.police / 60);
        if (rnd() < p) { c.saisi = C.saisie_cycles; log("Saisie de police : " + c.nom + ", " + VILLE.q[id].nom + " fermé " + C.saisie_cycles + " cycles.", "operation", id); }
      }
    });
  });
}

/* ---------- zones verrouillées et objectifs ---------- */
function zoneOuverte(z) { return G.zonesOuvertes.indexOf(z) >= 0; }
/** Zones qu'on peut chercher à ouvrir : voisines d'une zone ouverte. */
function zonesProposees() {
  var out = {};
  G.zonesOuvertes.forEach(function (z) {
    VILLE.zones[z].forEach(function (id) { VILLE.adj[id].forEach(function (v) { var zz = VILLE.q[v].zone; if (!zoneOuverte(zz)) out[zz] = 1; }); });
  });
  return Object.keys(out);
}
/** Liste des objectifs actifs (ouverture de zones + liste fixe), avec leur avancement. */
function quetesActives() {
  var Q = D.quetes, out = [], nb = G.zonesOuvertes.length;
  zonesProposees().forEach(function (z) {
    var o = Q.ouverture_zone;
    out.push({ id: "zone_" + z, zone: z, nom: o.nom.replace("{zone}", IDX.zones[z].nom), objectifs: o.objectifs.map(function (x) {
      var y = JSON.parse(JSON.stringify(x)); if (y.n_par_zone) y.n += y.n_par_zone * (nb - 1); y.zone = z; return y;
    }), recompense: o.recompense });
  });
  Q.liste.forEach(function (q) { if (!G.quetesFaites[q.id]) out.push(q); });
  out.forEach(function (q) { q.avance = q.objectifs.map(avancement); q.fini = q.avance.every(function (a) { return a.ok; }); });
  return out;
}
function avancement(o) {
  var v = 0, but = o.n || o.v || 0, txt = "";
  switch (o.type) {
    case "quartiers_tenus": v = VILLE.ordre.filter(function (id) { return G.q[id].ctl >= o.seuil; }).length; txt = "Quartiers à " + o.seuil + " % ou plus"; break;
    case "connaissance_zone": v = VILLE.zones[o.zone].filter(function (id) { return G.q[id].conn >= o.niveau; }).length; txt = "Quartiers repérés dans " + IDX.zones[o.zone].court; break;
    case "connaissance": v = VILLE.ordre.filter(function (id) { return G.q[id].conn >= o.niveau; }).length; txt = "Quartiers bien connus (niveau " + o.niveau + ")"; break;
    case "charbons": v = charbonsJoueur(); txt = "Charbons ouverts"; break;
    case "tresorerie": v = G.tresorerie; txt = "Trésorerie (€)"; break;
    case "securises": v = VILLE.ordre.filter(function (id) { return statut(id) === "securise"; }).length; txt = "Quartiers sécurisés"; break;
    case "operateurs": v = opsActifs().length; txt = "Opérateurs"; break;
    case "territoire": v = Math.round(territoire()); txt = "Territoire (%)"; break;
    case "flux": v = fluxActifs().length; txt = "Flux actifs"; break;
  }
  return { txt: txt, v: Math.round(v), but: but, ok: v >= but };
}
/** Valide les objectifs atteints et donne les récompenses. Retourne les noms des objectifs validés. */
function verifierQuetes() {
  if (!G || G.fini) return [];
  var faits = [];
  quetesActives().forEach(function (q) {
    if (!q.fini) return;
    var r = q.recompense || {};
    if (q.zone) {
      G.zonesOuvertes.push(q.zone);
      VILLE.zones[q.zone].forEach(function (id) { G.q[id].conn = Math.max(G.q[id].conn, 1); });
      if (r.capacite_toutes_les && (G.zonesOuvertes.length - 1) % r.capacite_toutes_les === 0) { G.capacite++; }
    } else G.quetesFaites[q.id] = G.cycle;
    if (r.argent) G.tresorerie += r.argent;
    if (r.capacite) G.capacite += r.capacite;
    log("Objectif atteint : " + q.nom + (r.argent ? " (+" + r.argent + " €)" : "") + (r.capacite ? " (capacité +" + r.capacite + ")" : "") + (q.zone ? " : zone ouverte." : "."), "quete");
    faits.push(q.nom);
  });
  return faits;
}

/* ---- 40-cycle.js ---- */
/* CHOUF v2 — 40-cycle : économie (§6), capacité (§7), flux internationaux (§8), indicateurs (§9),
   résolution d'un cycle (§10), événements, conditions de fin et bilan (§11).
   Ordre de résolution : saisons → opérateurs (transit, tâches, fatigue) → argent → factions → abandon →
   événements → indicateurs → trésorerie et dette → capacité → fin de partie. */

/* ---------- flux internationaux ---------- */
function offreFlux(id) { return B.flux.offres.filter(function (o) { return o.id === id; })[0]; }
function activerFlux(id) {
  var o = offreFlux(id);
  if (!o || G.flux.some(function (f) { return f.id === id && f.actif; })) return { ok: false, raison: "Déjà actif" };
  var cout = o.activation + o.engagement;
  if (G.tresorerie < cout) return { ok: false, raison: "Il faut " + cout + " € (activation + engagement)" };
  G.tresorerie -= cout;
  G.flux = G.flux.filter(function (f) { return f.id !== id; });
  G.flux.push({ id: id, actif: true, engage: o.engagement, fiabilite: o.fiabilite, exposition: o.exposition, instabilite: o.instabilite, cycles: 0, dernier: null });
  log("Flux activé : " + o.nom + " (−" + cout + " €).", "flux");
  save();
  return { ok: true };
}
function couperFlux(id) {
  var f = G.flux.filter(function (x) { return x.id === id && x.actif; })[0];
  if (!f) return;
  f.actif = false;
  log("Flux coupé : " + offreFlux(id).nom + ". " + f.engage + " € immobilisés perdus.", "flux");
  f.engage = 0;
  save();
}
function fluxActifs() { return G.flux.filter(function (f) { return f.actif; }); }

/* ---------- calculs du cycle (aussi utilisés pour l'aperçu du tableau de bord) ---------- */
/** Efficacité de pression appliquée aux revenus d'un quartier. */
function effRevenu(id) {
  var e = B.economie.revenu_sans_pression;
  opsActifs().forEach(function (o) { if (o.dispo !== "transit" && o.pos === id && o.tache === "presser") e = Math.max(e, efficacite(o, "presser")); });
  return e;
}
function reductionMaintien(id) {
  var r = 0;
  opsActifs().forEach(function (o) {
    if (o.dispo === "transit") return;
    if (o.pos === id && o.tache === "optimiser") r += B.taches.optimiser.baisse_maintien * efficacite(o, "optimiser");
    if ((o.pos === id || VILLE.adj[o.pos].indexOf(id) >= 0) && o.tache === "flux") r += B.taches.flux.baisse_maintien * efficacite(o, "flux") * (o.pos === id ? 1 : 0.5);
  });
  return clamp(r, 0, 0.8);
}
/** Prévision des entrées et sorties pour ce cycle (§6.2). */
function previsions() {
  var rev = 0, maint = 0, entr = 0, fluxRev = 0, fluxCout = 0, redEntr = 0;
  VILLE.ordre.forEach(function (id) {
    var s = G.q[id];
    if (s.ctl <= 0) return;
    var ch = s.ch.reduce(function (t, c) { return t + (c.proprio === "joueur" && c.ouvert && !c.saisi ? c.rent : 0); }, 0);
    rev += ch * (1 + s.inv * B.quartiers.investir_gain) * multSaison(id) * s.ctl / 100 * effRevenu(id);
    maint += s.maintien * (1 + s.inv * B.quartiers.investir_maintien) * (1 - reductionMaintien(id)) * s.ctl / 100;
  });
  opsActifs().forEach(function (o) {
    if (o.tache === "optimiser" && o.dispo !== "transit") redEntr += B.taches.optimiser.baisse_entretien * efficacite(o, "optimiser");
  });
  var nops = opsActifs().length;
  opsActifs().forEach(function (o) { entr += TYPES()[o.type].entretien; });
  entr *= 1 + Math.max(0, nops - 6) * (B.operateurs.entretien_progressif || 0);    // un gros réseau coûte plus cher par tête
  entr *= 1 - clamp(redEntr, 0, 0.3);
  fluxActifs().forEach(function (f) { var o = offreFlux(f.id); fluxRev += o.revenu * f.fiabilite / 100; fluxCout += o.cout; });
  var interets = G.dette * B.economie.dette_interet;
  return { revenus: Math.round(rev), maintien: Math.round(maint), entretien: Math.round(entr), flux_revenus: Math.round(fluxRev), flux_couts: fluxCout,
    interets: Math.round(interets), solde: Math.round(rev + fluxRev - maint - entr - fluxCout - interets) };
}

/* ---------- résolution ---------- */
function saisonsDuCycle() {
  var s = semaine(), out = [];
  B.evenements.saisons.forEach(function (x) {
    if (x.semaines && s >= x.semaines[0] && s <= x.semaines[1]) out.push(x.id);
    else if (x.pair_semaines && s % 2 === 0 && !(s >= x.hors_semaines[0] && s <= x.hors_semaines[1])) out.push(x.id);
    else if (x.proba && rnd() < x.proba) out.push(x.id);
  });
  return out;
}

/** Valide le cycle : le système résout tout et retourne le rapport (lignes courtes). */
function validerCycle() {
  if (G.fini) return null;
  var I = B.indicateurs, O = B.operateurs, T = B.taches, ind = G.ind;
  G.rapport = [];
  var avant = { tresorerie: G.tresorerie, territoire: territoire(), pression: ind.pression, stabilite: ind.stabilite, exposition: ind.exposition };
  var possede = {};
  VILLE.ordre.forEach(function (id) { possede[id] = G.q[id].ctl > 0; });
  G.saisons = saisonsDuCycle();
  G.saisons.forEach(function (sid) { if (sid !== "match") log(B.evenements.saisons.filter(function (x) { return x.id === sid; })[0].nom + " : revenus modifiés.", "saison"); });

  // 1. opérateurs
  var present = {};
  opsActifs().forEach(function (o) {
    if (o.dispo === "indisponible") {
      if (--o.indispo <= 0) { o.dispo = "disponible"; o.fatigue = O.fatigue_apres_indispo; o.tache = "repos"; }
      return;
    }
    if (o.dispo === "transit") {
      if (--o.transit > 0) return;
      o.pos = o.dest; o.dest = null; o.dispo = o.tache === "repos" ? "disponible" : "occupe";
      log(nomOp(o) + " arrive à " + VILLE.q[o.pos].nom + ".", "op", o.pos);
    }
    present[o.pos] = true;
    var t = T[o.tache], e = efficacite(o, o.tache), s = G.q[o.pos];
    if (!t || o.tache === "repos") { o.fatigue = Math.max(0, o.fatigue - O.fatigue_repos); return; }
    o.fatigue = clamp(o.fatigue + t.fatigue * O.fatigue_par_cycle_ratio * (ind.stabilite < I.stabilite_basse ? I.stabilite_basse_fatigue : 1), 0, 100);
    o.xp += O.progression_competence * (t.type === o.type ? 1 : 0.5);
    if (o.xp >= 1 && o.comp < 5) { o.xp = 0; o.comp++; log(nomOp(o) + " progresse : compétence " + o.comp + ".", "op"); }
    switch (o.tache) {
      case "securiser":
        var a = advTotal(s), baisse = Math.min(a, t.baisse_adverse * e);
        if (a > 0) for (var f in s.adv) s.adv[f] = Math.max(0, s.adv[f] - baisse * s.adv[f] / a);
        if (s.ctl > 0 || a > 0) gagnerControle(o.pos, t.gain_controle * e);
        ind.pression += t.pression; ind.exposition += t.exposition;
        break;
      case "presser":
        gagnerControle(o.pos, t.gain_controle * e);
        ind.pression += t.pression; ind.exposition += t.exposition;
        break;
      case "reperer":
        if (rnd() < Math.min(1, 0.4 + e * 0.5)) s.conn = Math.min(3, s.conn + t.connaissance);
        VILLE.adj[o.pos].forEach(function (v) { if (rnd() < 0.6 * e) G.q[v].conn = Math.min(3, Math.max(G.q[v].conn, 1)); });
        break;
      case "surveiller":
        s.conn = Math.max(s.conn, 2);
        VILLE.adj[o.pos].forEach(function (v) { G.q[v].vu = G.cycle + 1; });
        s.vu = G.cycle + 1;
        break;
      case "optimiser":
        ind.exposition -= (t.baisse_exposition || 0) * e;
        break;
      case "flux":
        fluxActifs().forEach(function (fl) { fl.fiabilite = clamp(fl.fiabilite + t.fiabilite_flux * e, 0, 100); });
        break;
    }
    if (o.fatigue >= 100) { o.dispo = "indisponible"; o.indispo = O.indispo_cycles; log(nomOp(o) + " est épuisé : indisponible 1 cycle.", "fatigue"); }
  });

  // 2. argent du cycle
  var p = previsions();
  var fluxNet = 0;
  fluxActifs().forEach(function (fl) {
    var o = offreFlux(fl.id), Fx = B.flux;
    fl.cycles++;
    ind.exposition += o.volume * Fx.exposition_par_volume * 0.5;
    fl.exposition = clamp(fl.exposition + o.volume * Fx.exposition_par_volume, 0, 100);
    fl.instabilite = clamp(fl.instabilite + Fx.instabilite_par_cycle, 0, 100);
    if (rnd() * 100 < fl.fiabilite) { fluxNet += o.revenu - o.cout; fl.dernier = "ok"; }
    else { fluxNet -= o.cout; fl.dernier = "perte"; fl.fiabilite = clamp(fl.fiabilite - 5, 0, 100); log(o.nom + " : livraison ratée, pas de revenu.", "flux"); }
    if (rnd() < fl.instabilite / Fx.rupture_div) {
      fl.actif = false;
      log("Rupture : " + o.nom + ". " + fl.engage + " € perdus, pression +8.", "rupture");
      G.dette += Math.round(fl.engage * 0.25); ind.pression += 8; fl.engage = 0;
      var lg = opsActifs().filter(function (x) { return x.type === "logistique" && x.dispo !== "transit"; })[0];
      if (lg && rnd() < 0.4) perdreOp(lg, "arrêté après la rupture du flux");
    } else if (fl.fiabilite < Fx.fiabilite_partenaire_perdu) {
      fl.actif = false; log("Le partenaire de " + o.nom + " disparaît. Flux perdu.", "rupture"); fl.engage = 0;
    }
  });
  var solde = p.revenus - p.maintien - p.entretien - p.interets + fluxNet;

  // 3. factions
  tourFactions();

  majCharbons();

  // 4. quartiers laissés seuls ou sans argent
  VILLE.ordre.forEach(function (id) {
    var s = G.q[id];
    if (s.ctl <= 0) { s.sans_op = 0; return; }
    if (present[id]) s.sans_op = 0; else s.sans_op++;
    if (s.sans_op > B.controle.abandon_cycles) {
      // un quartier sécurisé tient seul (plancher), les autres s'effritent sans présence
      if (statut(id) === "securise") s.ctl = Math.max(B.controle.securise_controle, s.ctl - 1);
      else s.ctl = Math.max(0, s.ctl - B.controle.abandon_baisse);
    }
    if (G.tresorerie <= 0 && G.dette > 0) s.ctl = Math.max(0, s.ctl - B.controle.degradation_sans_argent);
    if (ind.stabilite < I.stabilite_basse) s.ctl = Math.max(0, s.ctl - I.stabilite_basse_degradation);
  });

  // 5. événements
  evenementsCycle();

  // 6. indicateurs
  var gagnes = VILLE.ordre.filter(function (id) { return !possede[id] && G.q[id].ctl > 0; });
  gagnes.forEach(function (id) { log("Nouveau quartier : " + VILLE.q[id].nom + ".", "gain", id); });
  ind.pression += gagnes.length * I.pression_par_quartier_gagne;
  if (ind.exposition > I.exposition_alerte) { ind.pression += I.exposition_vers_pression; log("Exposition trop haute : la pression monte.", "alerte"); }
  ind.pression -= I.pression_baisse + ind.pression * I.pression_baisse_ratio; ind.exposition -= I.exposition_baisse + ind.exposition * I.exposition_baisse_ratio;
  ind.stabilite += (I.stabilite_vers - ind.stabilite) * I.stabilite_derive;
  opsActifs().forEach(function (o) { if (o.fatigue > 80) ind.stabilite -= I.stabilite_fatigue; });
  ind.stabilite += Math.min(4, Object.keys(present).filter(function (id) { return G.q[id].ctl > 0; }).length * I.stabilite_quartier_tenu);
  if (fluxActifs().length > B.flux.trop_de_flux) ind.stabilite -= (fluxActifs().length - B.flux.trop_de_flux) * I.stabilite_flux_sup;
  ind.pression = clamp(ind.pression, 0, 100); ind.exposition = clamp(ind.exposition, 0, 100); ind.stabilite = clamp(ind.stabilite, 0, 100);

  // 7. trésorerie et dette (§6.3)
  G.tresorerie += solde;
  if (G.tresorerie < 0) { G.dette += -G.tresorerie; G.tresorerie = 0; log("Trésorerie à zéro : dette +" + Math.round(G.dette) + " €.", "dette"); }
  else if (G.dette > 0) { var r = Math.min(G.dette, G.tresorerie * 0.5); G.dette -= r; G.tresorerie -= r; }
  G.tresorerie = Math.round(G.tresorerie); G.dette = Math.round(G.dette);
  G.cycles_zero = G.tresorerie <= 0 ? G.cycles_zero + 1 : 0;

  // 8. capacité (§7)
  if (G.cycle % B.capacite.tous_les === 0) { G.capacite++; log("Capacité +1 (" + G.capacite + ").", "capacite"); }
  var terr = territoire();
  B.capacite.seuils_territoire.forEach(function (sv) {
    if (terr >= sv && G.seuils_pris.indexOf(sv) < 0) { G.seuils_pris.push(sv); G.capacite++; log("Territoire " + sv + " % : capacité +1 (" + G.capacite + ").", "capacite"); }
  });

  verifierQuetes();

  // 9. bilan du cycle et fin
  G.dernier = { solde: Math.round(solde), revenus: p.revenus, couts: p.maintien + p.entretien + p.interets, flux: Math.round(fluxNet),
    d_territoire: r1(terr - avant.territoire), d_pression: r1(ind.pression - avant.pression), d_stabilite: r1(ind.stabilite - avant.stabilite), d_exposition: r1(ind.exposition - avant.exposition) };
  G.historique.push({ c: G.cycle, t: r1(terr), tr: G.tresorerie, p: Math.round(ind.pression) });
  verifierFin();
  var rap = G.rapport; G.rapport = null;
  G.cycle++;
  save();
  return { lignes: rap, d: G.dernier };
}

function perdreOp(o, raison) {
  o.dispo = "perdu"; o.tache = "repos";
  G.ind.stabilite = clamp(G.ind.stabilite - B.indicateurs.stabilite_perte, 0, 100);
  log(nomOp(o) + " (" + TYPES()[o.type].nom + ") perdu : " + raison + ".", "perteop", o.pos);
}

function evenementsCycle() {
  var E = B.evenements, ind = G.ind;
  var operation = ind.pression > B.indicateurs.pression_alerte && rnd() < E.operation_exterieure;
  if (operation) {
    ind.pression += E.operation_pression * 0.25;
    var tenus = VILLE.ordre.filter(function (id) { return G.q[id].ctl > 0; });
    tenus.sort(function () { return rnd() - 0.5; }).slice(0, 2).forEach(function (id) { G.q[id].ctl = Math.max(0, G.q[id].ctl - 10); });
    log("Opération extérieure : descentes dans tes quartiers, contrôle −10 dans deux d'entre eux.", "operation");
  }
  opsActifs().forEach(function (o) {
    if (o.dispo === "transit" || o.dispo === "perdu") return;
    var z = IDX.zones[VILLE.q[o.pos].zone];
    var pa = E.arrestation * (ind.pression / 100) * (z.police / 60) * (operation ? 2 : 1) * (o.tache === "repos" ? 0.3 : 1);
    if (rnd() < pa) { perdreOp(o, "arrêté"); return; }
    var s = G.q[o.pos], dom = factionDominante(s);
    if (o.type !== "force" && dom && s.adv[dom] > 50 && s.ctl > 0 && rnd() < E.elimination_contestee) perdreOp(o, "écarté par " + IDX.equipes[dom].nom);
  });
}

/** Conditions de fin (§11). */
function verifierFin() {
  var Fn = B.fin, terr = territoire();
  if (G.ind.pression >= B.indicateurs.pression_chute) return finir("chute");
  if (G.cycles_zero >= B.economie.faillite_cycles) return finir("faillite");
  if (terr >= Fn.victoire_territoire && G.tresorerie > 0) return finir("victoire");
  if (!opsActifs().length && G.tresorerie < Math.min.apply(0, Object.keys(TYPES()).map(function (t) { return TYPES()[t].recrutement; }))) return finir("faillite");
  if (G.cycle >= Fn.cycles_max) return finir("fin");
}
function finir(type) {
  var terr = territoire();
  var morts = Object.keys(G.factions).filter(function (f) { return !G.factions[f].vivante; }).length;
  var score = terr + Math.min(30, G.tresorerie / 2000) + morts * 6 + opsActifs().length * 2 - G.ind.pression / 5 - G.dette / 2000 + (type === "victoire" ? 20 : type === "fin" ? 0 : -25);
  var note = score >= 85 ? "A" : score >= 65 ? "B" : score >= 45 ? "C" : score >= 25 ? "D" : "E";
  G.fini = { type: type, cycles: G.cycle, territoire: r1(terr), tresorerie: G.tresorerie, dette: G.dette, operateurs: opsActifs().length,
    factions: Object.keys(G.factions).filter(function (f) { return G.factions[f].vivante; }).length, flux: fluxActifs().length,
    pression: Math.round(G.ind.pression), stabilite: Math.round(G.ind.stabilite), exposition: Math.round(G.ind.exposition), note: note };
  log("Fin de partie : " + type + ".", "fin");
}
function abandonner() { if (!G.fini) { finir("abandon"); save(); } }

/** Investir dans un quartier (§6.3). */
function coutInvestir(id) { return Math.round(Math.max(400, fluxQuartier(id)) * B.quartiers.investir_cout_ratio * (1 + G.q[id].inv)); }
function investir(id) {
  var s = G.q[id], c = coutInvestir(id);
  if (s.ctl <= 0) return { ok: false, raison: "Il faut tenir le quartier" };
  if (G.tresorerie < c) return { ok: false, raison: "Il faut " + c + " €" };
  G.tresorerie -= c; s.inv++;
  log("Investissement à " + VILLE.q[id].nom + " (−" + c + " €) : revenus et coûts en hausse.", "invest", id);
  save();
  return { ok: true };
}

/* ---- 55-plan.js ---- */
/* CHOUF — 55-plan : la ville en relief (vue stratégique façon jeu de gestion de territoires).
   Immeubles générés à partir de data/zones.json (bati, plan), teintés par l'équipe qui tient la zone,
   badges ronds au-dessus des quartiers, glisser pour se déplacer, pincer pour zoomer, toucher pour choisir.
   Le dessin des immeubles est fait une fois dans une image hors écran, puis seulement déplacé. */

var PLAN = { cache: null, sig: null, cam: null, el: null, ptr: {}, raf: 0 };

/* ---------- projection : plan (x, y, hauteur) → image hors écran ---------- */
function planProj() {
  var C = B.carte, a = C.rotation_deg * Math.PI / 180;
  return { c: Math.cos(a), s: Math.sin(a), k: C.ecrasement, hk: C.hauteur, R: C.resolution, minX: 0, minY: 0 };
}
function proj(P, x, y, h) {

    ids.forEach(function (id) { sx += VILLE.q[id].cx; sy += VILLE.q[id].cy; });
    var p = proj(C.P, sx / ids.length, sy / ids.length, 0), e = versEcran(p[0], p[1]);

  });
  // charbons (de près) : or = à toi, couleur = faction, gris = libre
  if (cam.z >= 0.62) VILLE.ordre.forEach(function (id) {
    var s = G.q[id];
    if (s.conn < 2 && s.ctl <= 0) return;
    s.ch.forEach(function (c) {

      var col = c.proprio === "joueur" ? (c.saisi ? "#7a5a20" : "#f2c94c") : c.proprio ? IDX.equipes[c.proprio].couleur : "#8d9096";
      g.beginPath(); g.arc(e[0], e[1], r * 0.42, 0, Math.PI * 2); g.fillStyle = col; g.fill();

  var parQ = {};

  Object.keys(parQ).forEach(function (id) {
    var l = parQ[id], p = ecranQ(id), w = l.length * (r * 2 + 3) - 3, x0 = p[0] - w / 2 + r;
    l.forEach(function (o, i) {

      if (UI.selOp === o.id) { g.beginPath(); g.arc(x, y, r + 5, 0, Math.PI * 2); g.fillStyle = "rgba(242,201,76,.45)"; g.fill(); }
      pastille(g, x, y, r, t.couleur, t.lettre, o.dispo === "indisponible" ? "#4a1c1c" : null, false);
      if (o.dispo === "transit") { g.setLineDash([3, 3]); g.beginPath(); g.arc(x, y, r + 3, 0, Math.PI * 2); g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.stroke(); g.setLineDash([]); }

function planDown(e) {

}

  if (ids.length === 2) {
    var a = PLAN.ptr[ids[0]], b = PLAN.ptr[ids[1]], d0 = Math.hypot(a.x - b.x, a.y - b.y);
    p.x = e.clientX; p.y = e.clientY;
    var d1 = Math.hypot(a.x - b.x, a.y - b.y);
    if (d0 > 0) zoomer(d1 / d0);
    return;
  }
  PLAN.cam.x -= (e.clientX - p.x) / PLAN.cam.z; PLAN.cam.y -= (e.clientY - p.y) / PLAN.cam.z;
  p.x = e.clientX; p.y = e.clientY;
  cancelAnimationFrame(PLAN.raf); PLAN.raf = requestAnimationFrame(planDessin);
}
function planUp(e) {
  var p = PLAN.ptr[e.pointerId];
  delete PLAN.ptr[e.pointerId];
  if (!p || Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 8 || Date.now() - p.t > 500) return;
  var rc = PLAN.el.getBoundingClientRect();
  toucherPlan(e.clientX - rc.left, e.clientY - rc.top);
}
/** Ce qui est sous le doigt : un opérateur (badge) ou un quartier (sol). */
function sousDoigt(sx, sy) {
  for (var i = 0; i < (PLAN.hits || []).length; i++) { var h = PLAN.hits[i]; if (Math.hypot(sx - h.x, sy - h.y) <= h.r) return { op: h.op }; }
  var cam = PLAN.cam, el = PLAN.el, ox = (sx - el.clientWidth / 2) / cam.z + cam.x, oy = (sy - el.clientHeight / 2) / cam.z + cam.y;
  var w = deproj(PLAN.cache.P, ox, oy);

}

  }).join("") +
    '<h3 class="h3">Prévision du cycle ' + G.cycle + "</h3>" + [["Charbons (" + charbonsJoueur() + ")", p.revenus], ["Flux internationaux (attendu)", p.flux_revenus - p.flux_couts], ["Maintien des quartiers", -p.maintien], ["Entretien des opérateurs", -p.entretien], ["Intérêts de la dette", -p.interets]]
      .map(function (x) { return '<div class="ligne-chiffre"><span>' + esc(x[0]) + "</span><b class=\"" + (x[1] < 0 ? "neg" : "") + '">' + sgn(x[1]) + " €</b></div>"; }).join("") +
    '<div class="ligne-chiffre tot"><span>Solde prévu</span><b>' + sgn(p.solde) + " €</b></div>" +
    '<button class="ligne-action" data-a="voirflux"><span><b>Flux internationaux</b><small>' + fluxActifs().length + " actif(s) sur " + B.flux.offres.length + "</small></span><em>›</em></button>" +
    '<h3 class="h3">Alertes</h3>' + (al.length ? '<ul class="alertes">' + al.map(function (a) { return "<li>" + esc(a) + "</li>"; }).join("") + "</ul>" : '<p class="petit">Rien d\'urgent.</p>') +
    '<button class="btn sec" data-a="abandon">Abandonner la partie</button>';
}
function vFlux() {
  return '<button class="retour" data-a="retourbord">‹ Bord</button><h2 class="h">Flux internationaux</h2><p class="petit">Engagements abstraits avec des partenaires extérieurs. Plus de volume : plus de revenus, plus d\'exposition.</p>' +
    B.flux.offres.map(function (o) {
      var f = G.flux.filter(function (x) { return x.id === o.id && x.actif; })[0], v = f || o;
      return '<div class="carte-bloc"><div class="ligne"><b>' + esc(o.nom) + "</b><span>" + (f ? '<i class="ok">actif · ' + f.cycles + " cycles</i>" : "inactif") + "</span></div>" +
        '<div class="grille">' + [["Volume", o.volume + "/5"], ["Revenu", eur(o.revenu) + "/cycle"], ["Coût", eur(o.cout) + "/cycle"], ["Engagement", eur(f ? f.engage : o.engagement)],
          ["Fiabilité", Math.round(v.fiabilite) + " %"], ["Exposition", Math.round(v.exposition)], ["Instabilité", Math.round(v.instabilite)], ["Activation", eur(o.activation)]]
          .map(function (x) { return "<span><small>" + x[0] + "</small><b>" + x[1] + "</b></span>"; }).join("") + "</div>" +
        (f ? '<button class="btn sec" data-couper="' + o.id + '">Couper (perd ' + eur(f.engage) + ")</button>" : '<button class="btn" data-activer="' + o.id + '">Activer · ' + eur(o.activation + o.engagement) + "</button>") + "</div>";
    }).join("") + '<p class="petit">Un opérateur Logistique sur « Gérer les flux » améliore la fiabilité. Plus de ' + B.flux.trop_de_flux + " flux à la fois : la stabilité baisse.</p>";
}

/* ---------------- FACTIONS ---------------- */
var OBJ = { contre: "Contre-attaquer", retraite: "Se rétracter", etendre: "Étendre", maintenir: "Maintenir" };
function vFactions() {
  var renseigne = opsActifs().some(function (o) { return o.tache === "surveiller" && o.dispo === "occupe"; });
  return '<h2 class="h">Factions</h2>' + D.equipes.liste.map(function (e) {
    var f = G.factions[e.id], t = territoireFaction(e.id), al = G.alliances.filter(function (x) { return x.a === e.id || x.b === e.id; })[0];
    var nch = 0; VILLE.ordre.forEach(function (id) { G.q[id].ch.forEach(function (c) { if (c.proprio === e.id) nch++; }); });
    return '<div class="carte-bloc faction' + (f.vivante ? "" : " morte") + '" style="border-left-color:' + e.couleur + '"><div class="ligne">' +
      (ASSET.u("chef_" + e.id) ? ASSET.img("chef_" + e.id, "med") : "") + "<b>" + esc(e.nom) + "</b><span>" + (f.vivante ? t.length + " quartiers · " + nch + " charbons" : "disparue") + "</span></div>" +
      (f.vivante ? '<div class="grille">' + [["Effectif", renseigne ? f.effectif : "≈ " + Math.max(1, Math.round(f.effectif / 3) * 3)], ["Budget", renseigne ? eur(f.budget) : "?"], ["Agressivité", "●".repeat(f.agressivite) + "○".repeat(5 - f.agressivite)],
        ["Objectif", renseigne ? OBJ[f.objectif] : "?"], ["Cible", renseigne && f.cible ? VILLE.q[f.cible].nom : "?"], ["Trêve", al ? "avec " + IDX.equipes[al.a === e.id ? al.b : al.a].nom : "—"]]
        .map(function (x) { return "<span><small>" + x[0] + "</small><b>" + esc(x[1]) + "</b></span>"; }).join("") + "</div>" : "") + "</div>";
  }).join("") + (renseigne ? "" : '<p class="petit">Mets un opérateur Intelligence sur « Surveiller » pour connaître objectifs, cibles et budgets.</p>');
}

/* ---------------- JOURNAL ---------------- */
function vJournal() {
  return '<h2 class="h">Journal</h2><ul class="journal">' + G.journal.slice(0, 150).map(function (j) {
    return '<li class="' + j.type + '"><small>C' + j.c + "</small> " + esc(j.t) + "</li>";
  }).join("") + "</ul>";
}

/* ---------------- fenêtres ---------------- */
function vRapport() {
  var r = UI.rapport, d = r.d;
  return '<div class="voile"><div class="sheet"><h2>Cycle ' + (G.cycle - 1) + " résolu</h2>" +
    '<div class="grille">' + [["Solde", sgn(d.solde) + " €"], ["Territoire", sgn(d.d_territoire, " %")], ["Pression", sgn(d.d_pression)], ["Stabilité", sgn(d.d_stabilite)]]
      .map(function (x) { return "<span><small>" + x[0] + "</small><b>" + x[1] + "</b></span>"; }).join("") + "</div>" +
    '<ul class="rapport">' + r.lignes.slice(0, 16).map(function (l) { return '<li class="' + l.type + '">' + esc(l.t) + "</li>"; }).join("") + "</ul>" +
    '<button class="btn" data-a="okrapport">Planifier le cycle ' + G.cycle + "</button></div></div>";
}
var FIN = { victoire: "Victoire", faillite: "Faillite", chute: "Chute", abandon: "Abandon", fin: "Fin du temps" };
function vFin() {
  var f = G.fini;
  return '<div class="accueil"><h1 class="titre">' + FIN[f.type] + '</h1><p class="note">Note ' + f.note + "</p>" +
    '<div class="grille">' + [["Cycles joués", f.cycles], ["Territoire", f.territoire + " %"], ["Trésorerie", eur(f.tresorerie)], ["Dette", eur(f.dette)], ["Opérateurs", f.operateurs],
      ["Factions restantes", f.factions], ["Flux actifs", f.flux], ["Pression", f.pression], ["Stabilité", f.stabilite], ["Exposition", f.exposition]]
      .map(function (x) { return "<span><small>" + x[0] + "</small><b>" + esc(x[1]) + "</b></span>"; }).join("") + "</div>" +
    '<button class="btn" data-a="rejouer">Nouvelle partie</button></div>';
}

/* ---------------- gestes ---------------- */
function toucherPlan(sx, sy) {
  var h = sousDoigt(sx, sy);
  if (h.op) { UI.selOp = UI.selOp === h.op ? null : h.op; UI.selQ = null; return render(); }
  if (!h.q) { UI.selQ = null; return render(); }
  if (UI.selOp) {
    var o = opParId(UI.selOp);
    var okR = o.type === "reperage" && accessible(h.q, "reperer");
    if (h.q !== o.pos && !accessible(h.q) && !okR) return toast(zoneOuverte(VILLE.q[h.q].zone) ? "Inaccessible : il faut un quartier voisin à " + B.controle.acces_voisin + " %." : "Zone verrouillée : seul un Repérage peut y entrer, depuis un quartier voisin.");
    UI.selQ = h.q; UI.taches = true; return render();
  }
  UI.selQ = h.q; render();
}
function onClick(ev) {
  var t = ev.target.closest("[data-a],[data-tab],[data-tache],[data-op],[data-recruter],[data-activer],[data-couper],[data-ind],[data-ch],[data-fermerch]");
  if (!t) return;
  var d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.ind) { var x = indicateurs().filter(function (i) { return i.k === d.ind; })[0]; return toast(x.n + " : " + x.e); }
  if (d.ch != null) { var rc = prendreCharbon(UI.selQ, +d.ch); return rc.ok ? render() : toast(rc.raison); }
  if (d.fermerch != null) { fermerCharbon(UI.selQ, +d.fermerch); return render(); }
  if (d.tache) {
    var r = affecter(UI.selOp, UI.selQ, d.tache);
    UI.taches = false;
    if (!r.ok) return toast(r.raison);
    var o = opParId(UI.selOp); UI.selOp = null; UI.selQ = null;
    return toast(o.id + " : " + B.taches[d.tache].nom + " à " + VILLE.q[lieuOp(o)].nom + ".");
  }
  if (d.op) {
    UI.selOp = d.op; UI.selQ = null; TAB = "carte";
    var q = VILLE.q[lieuOp(opParId(d.op))];
    if (PLAN.cam && PLAN.cache) { var p = proj(PLAN.cache.P, q.cx, q.cy, 0); PLAN.cam.x = p[0]; PLAN.cam.y = p[1]; }
    return render();
  }
  if (d.recruter) { var rr = recruter(d.recruter); return rr.ok ? toast(rr.op.id + " recruté.") : toast(rr.raison); }
  if (d.activer) { var ra = activerFlux(d.activer); verifierQuetes(); return ra.ok ? render() : toast(ra.raison); }
  if (d.couper) { couperFlux(d.couper); return render(); }
  switch (d.a) {
    case "nouvelle": case "rejouer": eraseSave(); newGame(); PLAN.cam = null; PLAN.cache = null; TAB = "carte"; UI.selOp = UI.selQ = null; save(); return render();
    case "continuer": loadSave(); PLAN.cam = null; PLAN.cache = null; return render();
    case "valider":
      UI.selOp = null; UI.selQ = null; UI.taches = false;
      var rap = validerCycle();
      if (!rap) return render();
      G.alertes = {};
      rap.lignes.forEach(function (l) { if ((l.type === "attaque" || l.type === "perte") && l.q) G.alertes[l.q] = 1; });
      UI.rapport = G.fini ? null : rap; save(); return render();
    case "okrapport": UI.rapport = null; return render();
    case "annuler": UI.selOp = null; return render();
    case "fermer": UI.selQ = null; return render();
    case "fermertaches": UI.taches = false; UI.selQ = null; return render();
    case "investir": var ri = investir(UI.selQ); return ri.ok ? render() : toast(ri.raison);
    case "voirflux": UI.sousBord = "flux"; return render();
    case "retourbord": UI.sousBord = null; return render();
    case "zplus": return zoomer(1.25);
    case "zmoins": return zoomer(0.8);
    case "abandon":
      if (!UI.confAb) { UI.confAb = true; setTimeout(function () { UI.confAb = false; }, 4000); return toast("Touche encore pour abandonner."); }
      abandonner(); return render();
  }
}
function boot() { document.addEventListener("click", onClick); render(); }

if (!window.__NOBOOT__) boot();
</script>
</body>
</html>
